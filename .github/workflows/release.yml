name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build lib tarball
        run: |
          mkdir -p dist
          tar czf "dist/agentic-lib-v${{ steps.version.outputs.version }}.tar.gz" \
            -C .agentic/lib \
            tools agents workflows quality quality_profiles checklists init \
            templates hooks claude-hooks prompts schemas presets support \
            token_efficiency \
            settings.sh settings.py paths.sh paths.py \
            PRINCIPLES.md DEVELOPER_GUIDE.md FRAMEWORK_MAP.md \
            DIRECT_EDITING.md EMERGENCY.md MANUAL_OPERATIONS.md \
            README.md ROI.md START_HERE.md VERSION

      - name: Verify tarball
        run: |
          echo "Tarball contents:"
          tar tzf "dist/agentic-lib-v${{ steps.version.outputs.version }}.tar.gz" | head -30
          echo "..."
          echo "Size: $(du -h dist/agentic-lib-v${{ steps.version.outputs.version }}.tar.gz | cut -f1)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/agentic-lib-v*.tar.gz
          generate_release_notes: true
