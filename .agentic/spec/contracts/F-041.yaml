id: F-041
name: Intelligence Engine
lifecycle: shipped
profile: both
protection: none
category: intelligence
description: >
  Core intelligence system that makes the framework smarter than vanilla Claude.
  Phase 1: Enforced patterns with write-time hook checking.
  Machine-matchable rules with scope globs — do-not-repeat mistakes, conventions,
  and positive patterns surfaced before every code write.
user_input: ''
assertions:
  # --- Phase 1: Patterns + Write Hook ---
  - id: AC-001
    text: >
      patterns.yaml exists at .agentic/intel/patterns.yaml with version, patterns[]
      array where each entry has id, text, reason, scope (glob), and severity
      (error|warning|info)
    type: structural

  - id: AC-002
    text: >
      `ag intel learn "text" --reason "why" --scope "glob"` appends a new pattern
      entry to patterns.yaml with auto-incremented ID (P-XXXX format)
    type: behavioral

  - id: AC-003
    text: >
      `ag intel check PATH` returns all patterns whose scope glob matches PATH,
      exits 0 with matches printed to stdout, exits 0 with no output if no matches
    type: behavioral

  - id: AC-004
    text: >
      `ag intel patterns` lists all patterns; `ag intel patterns --scope PATH`
      filters to patterns matching the given path's scope
    type: behavioral

  - id: AC-005
    text: >
      PreToolUse.sh injects matching pattern warnings into hook output before
      Write/Edit operations, using pure bash glob matching in <50ms
    type: behavioral

  - id: AC-006
    text: >
      `ag intel` dispatched correctly from ag.sh with subcommands: check, learn,
      remove, patterns, remember, memory (alias: cerebrum), forget, and help
    type: structural

  - id: AC-007
    text: >
      upgrade.sh creates .agentic/intel/ directory for existing projects that
      lack it
    type: structural

  # --- Phase 1b: Cerebrum — project-scoped learning ---
  - id: AC-008
    text: >
      `ag intel remember "text" --type preference|learning|decision --context "..."`
      appends entry to project-memory.yaml with auto-incremented C-XXXX ID and date
    type: behavioral

  - id: AC-009
    text: >
      `ag intel memory` lists all entries; `ag intel memory --type TYPE`
      filters by type (preference|learning|decision)
    type: behavioral

  - id: AC-010
    text: >
      `ag intel forget C-XXXX` removes a project memory entry by ID
    type: behavioral

  - id: AC-011
    text: >
      Instruction files (CLAUDE.md template, cursorrules, copilot, codex,
      memory-seed, 4 skills) contain trigger for auto-capturing user corrections
      via ag intel remember
    type: structural

  # --- Phase 2: Anatomy + Token Ledger ---
  - id: AC-012
    text: >
      `ag intel scan` walks project files, estimates token count via char-count
      ratio, extracts one-line summaries, and writes anatomy.yaml (git-tracked)
      plus anatomy.index (gitignored flat key-value for fast hook lookup)
    type: behavioral

  - id: AC-013
    text: >
      anatomy.yaml at .agentic/intel/anatomy.yaml has version, generated timestamp,
      and files[] array where each entry has path, summary, tokens (estimated),
      language, and related[] array
    type: structural

  - id: AC-014
    text: >
      `ag intel scan --check` exits 1 if anatomy.yaml is stale (project files
      changed since last scan timestamp) or missing, exits 0 if fresh
    type: behavioral

  - id: AC-015
    text: >
      `ag intel file PATH` returns file summary, estimated tokens, language,
      and related files from anatomy.index in <50ms via pure bash grep
    type: behavioral

  - id: AC-016
    text: >
      token-ledger.json at .agentic/session/token-ledger.json (gitignored)
      tracks per-session read count, write count, unique files, repeated reads,
      and estimated context cost
    type: structural

  - id: AC-017
    text: >
      token-summary.json at .agentic/intel/token-summary.json (git-tracked)
      aggregates lifetime stats: total sessions, total reads, total writes,
      repeated reads prevented, and last updated timestamp
    type: structural

  - id: AC-018
    text: >
      `ag intel stats` displays session metrics (if token-ledger.json exists)
      and lifetime aggregated metrics (from token-summary.json)
    type: behavioral

  - id: AC-019
    text: >
      PostToolUse.sh increments read/write counters in token-ledger.json after
      Read, Write, Edit, and MultiEdit tool operations using pure bash
    type: behavioral

  - id: AC-020
    text: >
      Stop.sh finalizes session token-ledger.json and merges counts into
      token-summary.json aggregated lifetime stats
    type: behavioral

  - id: AC-021
    text: >
      .gitignore includes .agentic/intel/anatomy.index; .agentic/session/
      already covers token-ledger.json
    type: structural

  # --- Phase 3: Bootstrap + Quality Intelligence ---
  - id: AC-022
    text: >
      `ag intel bootstrap` reads STACK.md for stack details (language, framework,
      domain, database) and scans the codebase (package files, imports, directory
      structure), then outputs a Stack Analysis section listing detected language,
      framework, domain, package manager, test framework, and directory structure,
      followed by Generation Instructions for three artifacts
    type: behavioral

  - id: AC-023
    text: >
      `ag intel bootstrap` output includes generation instructions for three
      artifacts: patterns (stack-specific anti-patterns for patterns.yaml),
      quality-checklist.yaml (5 dimensions × 4 phases), and test-strategy.yaml
      (per test level with framework, focus, patterns, antipatterns)
    type: behavioral

  - id: AC-024
    text: >
      quality-checklist.yaml has version, source, stack, and dimensions map
      where each dimension (usability, architecture, code_quality, testability,
      spec_adherence) contains phase arrays (planning, spec, implementation,
      testing) with actionable check items; items marked [formal] are filtered
      in Discovery mode
    type: structural

  - id: AC-025
    text: >
      test-strategy.yaml has version, source, stack, and levels map where each
      level (unit, component, integration, e2e) contains focus, framework,
      colocate (boolean), patterns[], and antipatterns[] fields
    type: structural

  - id: AC-026
    text: >
      `ag intel retro` reads ISSUES.md, LESSONS.md, and existing patterns.yaml,
      then outputs analysis context identifying recurring themes, unextracted
      lessons, and quality gaps for agent to suggest new patterns and checklist
      updates
    type: behavioral

  - id: AC-027
    text: >
      Bootstrap codebase scan detects: package manager files (package.json,
      requirements.txt, pyproject.toml, Cargo.toml, go.mod), test directories
      and frameworks, directory structure (src/, lib/, tests/), and key imports
      from entry files
    type: behavioral

  - id: AC-028
    text: >
      `ag intel bootstrap` and `ag intel retro` work without STACK.md by
      falling back to codebase detection only; partial STACK.md (missing
      fields) populates only the fields that are present, with remaining
      fields showing "not specified" or "none detected"; neither command
      crashes or returns a non-zero exit code
    type: behavioral

  # --- Phase 4: Phase-Aware Queries + Skill Integration ---
  - id: AC-029
    text: >
      `ag intel architecture` outputs ADR summaries, NFR constraints,
      CONTEXT_PACK overview, and quality-checklist planning-phase items;
      works with zero args in all profiles
    type: behavioral
    verify: "bash -c 'bash .agentic/lib/tools/ag.sh intel architecture 2>&1 | grep -aq \"Architecture Decision Records\"'"

  - id: AC-030
    text: >
      `ag intel spec [F-XXXX]` outputs feature landscape, contract patterns,
      NFR constraints, and quality-checklist spec-phase items; F-XXXX
      parameter is optional in Discovery mode, recommended in formal
    type: behavioral
    verify: "bash -c 'bash .agentic/lib/tools/ag.sh intel spec F-041 2>&1 | grep -aq \"Feature Landscape\"'"

  - id: AC-031
    text: >
      `ag intel implement [F-XXXX]` outputs code conventions, enforced
      patterns, lessons learned, project memory knowledge, and quality-checklist
      implementation-phase items; F-XXXX parameter is optional in Discovery
    type: behavioral
    verify: "bash -c 'bash .agentic/lib/tools/ag.sh intel implement F-041 2>&1 | grep -aq \"Code Conventions\"'"

  - id: AC-032
    text: >
      `ag intel test [F-XXXX]` outputs test strategy, test infrastructure,
      known issues, and quality-checklist testing-phase items; F-XXXX
      parameter is optional in Discovery mode
    type: behavioral
    verify: "bash -c 'bash .agentic/lib/tools/ag.sh intel test F-041 2>&1 | grep -aq \"Test Strategy\"'"

  - id: AC-033
    text: >
      All four phase-aware commands (architecture, spec, implement, test)
      filter [formal] tagged quality-checklist items in Discovery mode
      and rename spec_adherence dimension to intent_adherence
    type: behavioral
    verify: "bash -c 'grep -q intent_adherence .agentic/lib/tools/commands/intel.sh'"

  - id: AC-034
    text: >
      `ag intel help` lists all Phase 4 subcommands (architecture, spec,
      implement, test) under a "Phase-Aware Queries" section
    type: structural
    verify: "bash -c 'bash .agentic/lib/tools/ag.sh intel help 2>&1 | grep -q Phase-Aware'"

  - id: AC-035
    text: >
      Four workflow skills (planning-features, writing-specs,
      implementing-features, writing-tests) reference the corresponding
      ag intel phase command in their SKILL.md instructions
    type: structural
    verify: "bash -c 'grep -q \"ag intel architecture\" .claude/skills/planning-features/SKILL.md && grep -q \"ag intel test\" .claude/skills/writing-tests/SKILL.md'"

  - id: AC-036
    text: >
      Four instruction file templates (CLAUDE.md, cursorrules, copilot,
      codex) and memory-seed include phase intelligence trigger words
      referencing ag intel architecture|spec|implement|test
    type: structural
    verify: "bash -c 'grep -q \"ag intel architecture\" .agentic/lib/agents/claude/CLAUDE.md && grep -q \"ag intel architecture\" .agentic/lib/init/memory-seed.md'"

  - id: AC-037
    text: >
      dashboard.sh displays lifetime token metrics (sessions, reads, writes)
      when token-summary.json exists at .agentic/intel/token-summary.json
    type: behavioral
    verify: "bash -c 'grep -q TOKEN_METRICS .agentic/lib/tools/dashboard.sh'"

  # --- Error Recovery & Resilience ---
  - id: AC-038
    text: >
      Corrupted or empty patterns.yaml, project-memory.yaml, and anatomy.yaml
      do not crash any ag intel subcommand; commands exit 0 or 1 and
      never produce a Python traceback or shell error on stdout
    type: behavioral

  - id: AC-039
    text: >
      PreToolUse.sh and PostToolUse.sh handle malformed JSON input
      (non-JSON strings, empty stdin) without crashing; PreToolUse
      exits 0 (allow), PostToolUse exits 0 (no-op)
    type: behavioral

  - id: AC-040
    text: >
      `ag intel learn` creates patterns.yaml from scratch when the file
      does not exist, initializing with version: 1 and a patterns array
      containing the new entry with auto-incremented ID P-0001
    type: behavioral

  - id: AC-041
    text: >
      Stop.sh finalizes gracefully when token-events.log is missing or
      empty — does not crash or produce errors, writes no ledger when
      there are no events to finalize
    type: behavioral

  - id: AC-042
    text: >
      Phase-aware queries (architecture, spec, implement, test) handle
      non-existent feature IDs without crashing — show available data
      and skip sections that require the feature to exist
    type: behavioral

  # --- Intelligence Sourcing Audit Log ---
  - id: AC-043
    text: >
      intel-events.log at .agentic/session/intel-events.log (session-scoped,
      gitignored) records one line per intelligence event in pipe-delimited
      format: TIMESTAMP|EVENT|DETAIL|ITEMS where EVENT is one of query,
      enforce, mutate, scan; DETAIL identifies the subcommand or source;
      ITEMS is the count of intelligence items surfaced
    type: structural

  - id: AC-044
    text: >
      Each phase-aware query (architecture, spec, implement, test) appends
      a query event to intel-events.log with the subcommand name and
      the count of intelligence items found (ADRs, NFRs, patterns,
      lessons, checklist presence, etc.); spec/implement/test include
      the feature ID in the detail field when provided
    type: behavioral
    verify: "bash -c 'grep -q _intel_log .agentic/lib/tools/commands/intel.sh'"

  - id: AC-045
    text: >
      PreToolUse.sh appends an enforce event to intel-events.log when
      pattern warnings are surfaced for a Write/Edit operation, recording
      the target filename and the number of matching patterns; no event
      is logged when no patterns match or for Read operations
    type: behavioral

  - id: AC-046
    text: >
      Mutation commands (learn, remove, remember, forget) each append
      a mutate event to intel-events.log with the entry ID and operation
      type in the detail field
    type: behavioral

  - id: AC-047
    text: >
      Scan commands (scan/anatomy, bootstrap, retro) each append a scan
      event to intel-events.log with the scan type and the count of
      items analyzed (files scanned, sources detected, patterns+issues
      reviewed)
    type: behavioral

  - id: AC-048
    text: >
      intel-summary.json at .agentic/intel/intel-summary.json (git-tracked)
      aggregates lifetime intel usage: total_sessions, total_queries,
      total_enforcements, total_mutations, total_scans,
      total_items_surfaced, and last_updated timestamp
    type: structural
    verify: "bash -c 'grep -q intel-summary.json .agentic/lib/claude-hooks/Stop.sh'"

  - id: AC-049
    text: >
      Stop.sh finalizes intel-events.log by counting events per type,
      merging into intel-summary.json lifetime aggregates, printing a
      summary line to stderr, and removing the session events file;
      gracefully no-ops when intel-events.log is missing or empty
    type: behavioral

  - id: AC-050
    text: >
      `ag intel stats` displays session intel sourcing metrics (queries,
      enforcements, mutations, scans, items sourced) from intel-events.log
      and lifetime metrics from intel-summary.json; warns "agent may be
      improvising" when session has zero queries and zero enforcements
    type: behavioral

  - id: AC-051
    text: >
      dashboard.sh displays lifetime intel sourcing metrics (queries,
      enforcements, items sourced) when intel-summary.json exists
    type: behavioral
    verify: "bash -c 'grep -q INTEL_METRICS .agentic/lib/tools/dashboard.sh'"

  # --- Auto-Capture Pipeline (decision/instruction/correction/confirmation detection) ---
  - id: AC-052
    text: >
      `ag intel remember` accepts --source flag (manual|agent_capture|settings_change|session_audit)
      and --session flag; entries in project-memory.yaml include source and session fields
      when provided; defaults to source=manual when omitted
    type: structural
    verify: "bash -c 'grep -q \"\\-\\-source\" .agentic/lib/tools/commands/intel.sh && grep -q \"\\-\\-session\" .agentic/lib/tools/commands/intel.sh'"

  - id: AC-053
    text: >
      UserPromptSubmit.sh detects four signal types in user prompts:
      instructions (always/never + verb), decisions (let's go with/I prefer),
      corrections (no + correction context), and confirmations (yes/ok with
      pending-decision.txt); writes detected signals to session decision buffer
    type: structural
    verify: "bash -c 'grep -q decision_signal .agentic/lib/claude-hooks/UserPromptSubmit.sh && grep -q decision-buffer.log .agentic/lib/claude-hooks/UserPromptSubmit.sh'"

  - id: AC-054
    text: >
      Decision buffer at .agentic/session/decision-buffer.log uses pipe-delimited
      format TIMESTAMP|SIGNAL_TYPE|PROMPT_TEXT (append-only, session-scoped);
      cleaned up by Stop.sh at session end
    type: structural
    verify: "bash -c 'grep -q decision-buffer.log .agentic/lib/claude-hooks/Stop.sh'"

  - id: AC-055
    text: >
      Pending-decision protocol: UserPromptSubmit resolves .agentic/session/pending-decision.txt
      when user confirms (yes/ok/approved); PostToolUse resolves it when agent
      acts (Write/Edit/Bash) after a pending decision exists; both write to
      decision buffer and clean up the pending file
    type: structural
    verify: "bash -c 'grep -q pending-decision.txt .agentic/lib/claude-hooks/UserPromptSubmit.sh && grep -q pending-decision.txt .agentic/lib/claude-hooks/PostToolUse.sh'"

  - id: AC-056
    text: >
      `ag set` auto-logs mode-affecting settings changes (profile, acceptance_criteria,
      plan_review_enabled, git_workflow, docs_gate, etc.) to project-memory.yaml
      with type=decision and source=settings_change
    type: structural
    verify: "bash -c 'grep -q settings_change .agentic/lib/tools/commands/settings.sh'"

  - id: AC-057
    text: >
      Stop.sh audits the decision buffer at session end: compares signal count
      to cerebrum mutation count and warns when decisions were detected but
      not captured; suggests `ag intel batch-remember --from-buffer`
    type: structural
    verify: "bash -c 'grep -q batch-remember .agentic/lib/claude-hooks/Stop.sh'"

  - id: AC-058
    text: >
      `ag intel batch-remember --from-buffer` reads decision-buffer.log and
      creates project memory entries for each signal; maps signal types to
      entry types (instruction→preference, decision/confirmation→decision,
      correction→learning)
    type: structural
    verify: "bash -c 'grep -q _intel_batch_remember .agentic/lib/tools/commands/intel.sh'"

  - id: AC-059
    text: >
      `ag intel decisions` lists all project memory entries of type=decision
      plus recent journal --decision entries; provides unified view of all
      decisions with provenance
    type: structural
    verify: "bash -c 'grep -q _intel_decisions .agentic/lib/tools/commands/intel.sh'"

  - id: AC-060
    text: >
      Decision entries of type=decision auto-dual-write to JOURNAL.md via
      journal.sh --decision flag, creating grep-able **Decision**: lines
      for chronological traceability alongside structured project-memory.yaml
    type: structural
    verify: "bash -c 'grep -q \"journal_tool.*journal.sh\" .agentic/lib/tools/commands/intel.sh'"

  # --- Plan Review Gate (PreToolUse enforcement) ---
  - id: AC-061
    text: >
      PreToolUse.sh blocks Write/Edit on implementation files when
      .agentic/session/.plan-needs-review sentinel exists; allows edits
      to plan, doc, config, and review files; sentinel created by
      UserPromptSubmit DRAFT plan detection
    type: structural
    verify: "bash -c 'grep -q plan-needs-review .agentic/lib/claude-hooks/PreToolUse.sh'"

  - id: AC-062
    text: >
      `ag plan skip` creates .agentic/session/.plan-review-skipped sentinel,
      removes .plan-needs-review, logs the decision to project memory with
      source=agent_capture; PreToolUse respects the skip sentinel
    type: structural
    verify: "bash -c 'grep -q plan-review-skipped .agentic/lib/tools/commands/plan.sh && grep -q plan-review-skipped .agentic/lib/claude-hooks/PreToolUse.sh'"
