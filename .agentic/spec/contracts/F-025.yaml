id: F-025
name: Agent System & Instructions
lifecycle: shipped
since: v0.6.0
profile: both
protection: contract
category: agent-system
consolidated_from: [F-0081, F-0082, F-0083, F-0084, F-0093, F-0111, F-0113, F-0121, F-0135, F-0143, F-0146, F-0234]

description: |
  Agents are defined through instruction files (CLAUDE.md, .cursorrules,
  copilot-instructions, codex instructions) with role-specific scoping.
  Three-tier boundaries: Constitution (<100 lines), Playbooks (skills,
  workflows), State (artifacts). Skills-primary architecture for Claude Code.
  Memory-seed provides defense-in-depth reinforcement. Agent definition
  reconciliation detects drift between instruction file variants. Tier-based
  model selection optimizes cost. Untracked files protection prevents
  accidental exposure.

user_input: ""

assertions:
  - id: AC-001
    text: "CLAUDE.md template exists under 100 lines (constitution layer)"
    type: structural
    verify: |
      test -f .agentic/lib/agents/claude/CLAUDE.md &&
      [ $(wc -l < .agentic/lib/agents/claude/CLAUDE.md) -le 100 ]
    tests:
      - tests/infrastructure/structural/S08_claude_md_under_100_lines.sh

  - id: AC-002
    text: "Skills directory exists with implementing-features, writing-specs, etc."
    type: structural
    verify: |
      test -d .agentic/lib/agents/claude/skills/implementing-features &&
      test -d .agentic/lib/agents/claude/skills/writing-specs
    tests:
      - tests/validate_framework.sh::F-0143

  - id: AC-003
    text: "memory-seed.md exists for defense-in-depth rule reinforcement"
    type: structural
    verify: "test -f .agentic/lib/init/memory-seed.md"
    tests:
      - tests/validate_framework.sh::F-0135

  - id: AC-004
    text: "Multi-tool instruction files exist (copilot, codex)"
    type: structural
    verify: |
      test -f .agentic/lib/agents/copilot/copilot-instructions.md
    tests:
      - tests/validate_framework.sh::F-0121

  - id: AC-005
    text: "context-for-role.sh provides scoped context for subagents"
    type: structural
    verify: "test -f .agentic/lib/tools/context-for-role.sh"
    tests:
      - tests/validate_framework.sh::F-025

  - id: AC-006
    text: ".cursor/rules/ directory with .mdc files generated by setup-agent.sh cursor"
    type: structural
    verify: |
      test -d .agentic/lib/agents/cursor/rules &&
      [ "$(ls .agentic/lib/agents/cursor/rules/*.mdc 2>/dev/null | wc -l)" -gt 0 ]
    tests:
      - tests/validate_framework.sh::F-025-AC-006

  - id: AC-007
    text: ".cursor/hooks.json generated by setup-agent.sh wires all 5 hook events (PreToolUse, PostToolUse, SessionStart, UserPromptSubmit, Stop)"
    type: structural
    verify: |
      test -f .agentic/lib/agents/cursor/hooks.json &&
      python3 -c "import json,sys; h=json.load(open(sys.argv[1]))['hooks']; sys.exit(0 if all(k in h for k in ['PreToolUse','PostToolUse','SessionStart','UserPromptSubmit','Stop']) else 1)" .agentic/lib/agents/cursor/hooks.json
    tests:
      - tests/validate_framework.sh::F-025-AC-007

  - id: AC-008
    text: ".cursor/agents/*.md files have Cursor-compatible frontmatter (model, tools fields)"
    type: structural
    verify: |
      test -f .agentic/lib/tools/setup-agent.sh &&
      grep -q 'model: auto' .agentic/lib/tools/setup-agent.sh
    tests:
      - tests/validate_framework.sh::F-025-AC-008

  - id: AC-009
    text: ".cursor/skills/ directory with SKILL.md files generated by setup"
    type: structural
    verify: |
      test -f .agentic/lib/tools/generate-cursor-skills.sh &&
      test -x .agentic/lib/tools/generate-cursor-skills.sh
    tests:
      - tests/validate_framework.sh::F-025-AC-009

  - id: AC-010
    text: "upgrade.sh regenerates .cursor/ artifacts (rules, hooks.json, skills) when Cursor is configured"
    type: structural
    verify: |
      grep -q '5b-cursor' .agentic/lib/tools/upgrade.sh &&
      grep -q 'setup-agent.sh.*cursor' .agentic/lib/tools/upgrade.sh
    tests: []

  - id: AC-011
    text: "sync.sh and check-environment.sh detect incomplete .cursor/ artifacts when .cursorrules exists"
    type: structural
    verify: |
      grep -q 'cursor/rules' .agentic/lib/tools/sync.sh &&
      grep -q 'cursor/hooks.json' .agentic/lib/tools/check-environment.sh
    tests: []

  - id: AC-012
    text: "Cursor Stop hook clears all session sentinels including .correction_hint_shown"
    type: structural
    verify: |
      grep -q 'correction_hint_shown' .agentic/hooks/cursor/enforcement.sh &&
      grep -q 'plan-review-skipped' .agentic/hooks/cursor/enforcement.sh
    tests: []

  - id: AC-013
    text: "SessionStart clears session sentinels for crash recovery (both Claude and Cursor)"
    type: structural
    verify: |
      grep -q 'correction_hint_shown' .agentic/lib/claude-hooks/SessionStart.sh &&
      grep -q 'correction_hint_shown' .agentic/hooks/cursor/context.sh
    tests: []

nfr_refs: [NFR-0001]
scenarios:
  - name: "Instruction files stay under size limits"
    given: "Framework with all instruction files"
    when: "Check constitution-layer files"
    then: "All under 100 lines per NFR-0001"

migrations:
  - id: M-001
    date: "2026-04-09"
    trigger: "cursor-support-upgrade"
    reason: "Cursor IDE evolved: .cursorrules deprecated, subagent frontmatter changed, skills/hooks.json/MCP added. Adding planned ACs for Cursor parity."
    changes:
      - "Added AC-006 (rules migration), AC-007 (hooks.json), AC-008 (agent frontmatter), AC-009 (skills) with status: planned"
    approved_by: "user"

  - id: M-002
    date: "2026-04-09"
    trigger: "cursor-sync-upgrade-path"
    reason: "New .cursor/ artifacts were not wired into upgrade/sync/init paths. Session sentinels lacked cleanup parity between Claude and Cursor hooks, and were not cleared at session start for crash recovery."
    changes:
      - "AC-006 through AC-009: promoted from planned to built, updated verify commands and test references"
      - "Added AC-010: upgrade.sh step 5b-cursor regenerates .cursor/ on upgrade"
      - "Added AC-011: sync.sh + check-environment.sh detect incomplete .cursor/ artifacts"
      - "Added AC-012: Cursor Stop hook sentinel cleanup parity (.correction_hint_shown)"
      - "Added AC-013: SessionStart clears sentinels for crash recovery (Claude + Cursor)"
    approved_by: "user"
