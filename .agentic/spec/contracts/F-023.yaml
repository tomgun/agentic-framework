id: F-023
name: Hook-Based Enforcement
lifecycle: shipped
since: v0.65.0
profile: both
protection: contract
category: architecture
consolidated_from: [F-0245, F-0246, F-0247, F-0248, F-0249]

description: |
  Enforcement moved from runtime checks to git/tool hooks. Stop gate
  enforcement via Claude Code hooks. PreToolUse gate enforcement for
  tool-level policy. Context hooks inject relevant information. V2 engine
  stripped in favor of hooks-first architecture. Cross-tool export
  generates CI-compatible checks.

user_input: ""

assertions:
  - id: AC-001
    text: "Claude hooks directory exists"
    type: structural
    verify: |
      test -d .agentic/lib/claude-hooks ||
      test -d .agentic/claude-hooks
    tests:
      - tests/validate_framework.sh::F-023

  - id: AC-002
    text: "ag hooks command exists"
    type: structural
    verify: |
      grep -q "hooks" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-023

  - id: AC-003
    text: "Dashboard detects hooks from .claude/hooks.json"
    type: structural
    verify: |
      grep -q '\.claude/hooks\.json' .agentic/lib/tools/dashboard.sh
    tests:
      - tests/validate_framework.sh::dashboard-hooks-detection

  - id: AC-004
    text: "Dashboard validates framework hook event types in hooks.json"
    type: structural
    verify: |
      grep -q 'fw_types' .agentic/lib/tools/dashboard.sh
    tests:
      - tests/validate_framework.sh::dashboard-hooks-event-types

  - id: AC-005
    text: "Dashboard advises restart after fixing disconnected hooks"
    type: structural
    verify: |
      grep -q 'RESTART.*Claude Code' .agentic/lib/tools/dashboard.sh
    tests:
      - tests/validate_framework.sh::dashboard-restart-advice

  - id: AC-006
    text: "CLAUDE.md templates include restart advice for disconnected hooks"
    type: structural
    verify: |
      grep -q 'restart.*Claude Code' CLAUDE.md &&
      grep -q 'restart.*Claude Code' .agentic/lib/agents/claude/CLAUDE.md
    tests:
      - tests/validate_framework.sh::template-restart-advice

  - id: AC-007
    text: "Dashboard reports connected when .claude/hooks.json has framework hooks"
    type: functional
    verify: |
      bash .agentic/lib/tools/dashboard.sh 2>/dev/null | grep -q 'Hooks + skills active'
    tests:
      - tests/validate_framework.sh::dashboard-functional-connected

nfr_refs: []
migrations:
  - id: M-001
    date: "2026-04-06"
    trigger: additive
    reason: "Add AC-003 to AC-007 for disconnection detection and remediation"
    changes:
      - "Added AC-003: Dashboard detects hooks from .claude/hooks.json"
      - "Added AC-004: Dashboard validates framework hook event types"
      - "Added AC-005: Dashboard advises restart after fixing"
      - "Added AC-006: CLAUDE.md templates include restart advice"
      - "Added AC-007: Functional test for connected state"
