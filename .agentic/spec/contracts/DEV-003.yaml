id: DEV-003
name: Instruction File Integrity
lifecycle: shipped
since: v0.45.0
profile: both
protection: contract
category: dev-infrastructure
parent: DEV-001
tags: [infrastructure, internal]
consolidated_from: [DEV-0199, F-0226]

description: |
  Instruction file sync detection catches drift between agent instruction
  file variants (CLAUDE.md, .cursorrules, copilot, codex). Post-merge
  dogfooding ensures template changes propagate to root files.

user_input: ""

assertions:
  - id: AC-001
    text: "dogfood-sync.sh exists for template-to-root synchronization"
    type: structural
    verify: "test -f .agentic/lib/tools/dogfood-sync.sh"
    tests:
      - tests/validate_framework.sh::F-0226

  - id: AC-002
    text: "ag dogfood command exists"
    type: structural
    verify: |
      grep -q "dogfood" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-0226

  - id: AC-003
    text: "ag sync detects and auto-fixes missing Claude Code hooks"
    type: structural
    verify: |
      grep -q "claude.*hook\|Claude.*hook" .agentic/lib/tools/sync.sh &&
      grep -q "hooks.json" .agentic/lib/tools/sync.sh
    tests:
      - tests/test_hooks_detection.py::TestSyncHooksCheck

nfr_refs: []
migrations:
  - date: "2026-03-26"
    trigger: "Add Claude Code hooks detection to ag sync (AC-003)"
    reason: "Hooks were not installed in framework repo — dogfooding gap went undetected"
    approved_by: user
