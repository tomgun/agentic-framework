description: 'Cross-cutting development constraints that shape all work: small batch

  development (max 5-10 files per commit), checklist-driven workflows,

  iterative & incremental approach, human-agent collaboration patterns,

  living documentation, green coding principles. Optional TDD mode adds

  structural test-first enforcement. These become NFR-like constraints

  applied across all features.

  '
user_input: ''
assertions:
- id: AC-001
  text: Batch size advisory in pre-commit (warns on >10 files)
  type: structural
  verify: 'grep -q "max.*10\|Batch size\|files staged" .agentic/lib/hooks/pre-commit-check.sh

    '
  tests:
  - tests/validate_framework.sh::F-0007
- id: AC-002
  text: Workflow documents exist for development guidance
  type: structural
  verify: 'test -d .agentic/lib/workflows ||

    test -d .claude/skills

    '
  tests:
  - tests/validate_framework.sh::F-0069
- id: AC-003
  text: TDD mode enforcement exists (optional, development_mode setting)
  type: structural
  verify: 'grep -q "TDD\|tdd" .agentic/lib/hooks/pre-commit-check.sh

    '
  tests:
  - tests/validate_framework.sh::F-0209
