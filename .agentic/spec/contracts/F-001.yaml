id: F-001
name: Project Initialization & Profiles
lifecycle: shipped
since: v0.1.0
profile: both
protection: contract
category: core-workflow
consolidated_from: [F-0001, F-0002, F-0009, F-0123, F-0124, F-0131, F-0141]

description: |
  Initialize new projects with the Agentic framework. Users choose between
  Discovery (lightweight quality + workflows) and Formal (adds spec-driven
  development, feature tracking) profiles. Settings in STACK.md control all
  behavior — profiles are just preset bundles. Existing projects get intelligent
  onboarding with domain discovery and systematic brownfield spec generation.

user_input: ""

assertions:
  - id: AC-001
    text: "install.sh exists and is executable"
    type: structural
    verify: "test -x .agentic/../install.sh || test -x install.sh"
    tests:
      - tests/validate_framework.sh::F-001

  - id: AC-002
    text: ".agentic/ directory is created with VERSION, lib/, session/ subdirectories"
    type: structural
    verify: |
      test -d .agentic/lib && test -d .agentic/session && test -f .agentic/lib/VERSION
    tests:
      - tests/validate_framework.sh::F-001

  - id: AC-003
    text: "Formal profile scaffolds spec/ with contracts/ and FEATURES.md"
    type: structural
    verify: |
      test -d .agentic/spec/contracts && test -f .agentic/spec/FEATURES.md
    tests:
      - tests/validate_framework.sh::F-001

  - id: AC-004
    text: "STACK.md template has profile field and settings-over-profiles architecture"
    type: structural
    verify: |
      test -f .agentic/lib/init/STACK.template.md &&
      grep -q "profile:" .agentic/lib/init/STACK.template.md
    tests:
      - tests/validate_framework.sh::F-0131

  - id: AC-005
    text: "Brownfield onboarding discovers domains and generates spec plan"
    type: behavioral
    verify: null
    tests:
      - tests/llm/tests/005_brownfield_onboarding.sh

  - id: AC-006
    text: "Installation warns if .agentic/ already exists (no silent overwrite)"
    type: behavioral
    verify: null
    tests: []

nfr_refs: []
scenarios:
  - name: "Fresh formal project initialization"
    given: "Empty target directory"
    when: "Run install.sh and select formal profile"
    then: "spec/ created with acceptance/, FEATURES.md; STACK.md has profile: formal"

  - name: "Brownfield onboarding"
    given: "Existing project with code but no .agentic/"
    when: "Run install.sh"
    then: "Domain discovery runs, generates brownfield spec plan"

migrations:
  - id: M-2026-03-22-001
    date: "2026-03-22"
    trigger: implementation_discovery
    reason: "F-031 Phase 3: spec/acceptance archived, contracts are now primary"
    changes:
      - "AC-003: verify checks spec/contracts instead of spec/acceptance"
    approved_by: user
