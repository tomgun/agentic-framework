id: F-0003
name: Spec-Driven Development
lifecycle: shipped
since: v0.1.0
profile: formal
protection: contract
category: core-workflow
consolidated_from: [F-0003, F-0005, F-0006, F-0010, F-0043, F-0117, F-0128, F-0132, F-0147, F-0148, F-0149, F-0152, F-0251]

description: |
  Formal-profile projects manage features through specifications with testable
  acceptance criteria. Features have lifecycle states, enforcement gates, and
  migration-protected shipped specs. Spec evolution supports delta tracking,
  format versioning, and semantic consistency analysis. The spec-first gate
  blocks implementation without acceptance criteria.

user_input: ""

assertions:
  - id: AC-001
    text: "Formal profile creates spec/ directory with acceptance/ and FEATURES.md"
    type: structural
    verify: |
      test -d .agentic/spec/acceptance && test -f .agentic/spec/FEATURES.md
    tests:
      - tests/validate_framework.sh::F-0003

  - id: AC-002
    text: "ag implement blocks when feature has no acceptance criteria file"
    type: behavioral
    verify: null
    tests:
      - tests/llm/tests/003_acceptance_first.sh
      - tests/llm/tests/010_feature_needs_spec.sh

  - id: AC-003
    text: "Shipped spec changes require migration entry in spec/migrations/"
    type: structural
    verify: |
      grep -q "Shipped spec changes require migration" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-0117

  - id: AC-004
    text: "spec-writing skill exists for guided spec creation"
    type: structural
    verify: "test -f .claude/skills/writing-specs/SKILL.md"
    tests:
      - tests/validate_framework.sh::F-0003

  - id: AC-005
    text: "Spec validation tool checks FEATURES.md format and cross-references"
    type: structural
    verify: |
      test -f .agentic/lib/tools/validate_specs.py
    tests:
      - tests/validate_framework.sh::F-0043

  - id: AC-006
    text: "Spec evolution supports delta tracking via migrations directory"
    type: structural
    verify: |
      test -d .agentic/spec/migrations
    tests:
      - tests/validate_framework.sh::F-0117

nfr_refs: [NFR-0004]
scenarios:
  - name: "Spec-first gate blocks implementation"
    given: "Formal project, F-0099 in FEATURES.md with no AC file"
    when: "Agent runs ag implement F-0099"
    then: "Command exits with BLOCKED, message references missing acceptance criteria"

  - name: "Shipped spec protected by migration"
    given: "Shipped feature F-0003 with acceptance criteria"
    when: "Developer modifies spec/acceptance/F-0003.md and commits"
    then: "Pre-commit blocks unless spec/migrations/ has matching entry"

migrations: []
