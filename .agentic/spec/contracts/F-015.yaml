id: F-015
name: Session Management
lifecycle: shipped
since: v0.3.0
profile: both
protection: contract
category: session
consolidated_from: [F-0021, F-0022, F-0023, F-0024, F-0025, F-0026, F-0027, F-0125, F-0126, F-0127, F-0136, F-0145, F-0156, F-0240]

description: |
  Sessions have a structured start/end protocol. Start: check for interrupted
  work (WIP), read state files (STATUS.md, CONTEXT_PACK.md, JOURNAL.md,
  HUMAN_NEEDED.md), surface blockers. End: update journal, commit state.
  JOURNAL.md tracks decisions and outcomes. STATUS.md is the living truth.
  CONTEXT_PACK.md provides architecture context. HUMAN_NEEDED.md escalates
  blockers. Drift detection (ag sync) catches stale state. TODO.md captures
  ideas. Framework execution log tracks agent operations.

user_input: ""

assertions:
  - id: AC-001
    text: "dashboard.sh renders session status at start"
    type: structural
    verify: "test -f .agentic/lib/tools/dashboard.sh"
    tests:
      - tests/validate_framework.sh::F-015

  - id: AC-002
    text: "Session start checks for interrupted work (WIP) first"
    type: behavioral
    verify: null
    tests:
      - tests/llm/tests/001_session_start.sh

  - id: AC-003
    text: "journal.sh updates JOURNAL.md without full file rewrite"
    type: structural
    verify: "test -f .agentic/lib/tools/journal.sh"
    tests:
      - tests/validate_framework.sh::F-0023

  - id: AC-004
    text: "status.sh updates STATUS.md focus line"
    type: structural
    verify: "test -f .agentic/lib/tools/status.sh"
    tests:
      - tests/validate_framework.sh::F-0024

  - id: AC-005
    text: "HUMAN_NEEDED.md tracks blockers requiring human action"
    type: structural
    verify: "test -f .agentic/lib/tools/blocker.sh"
    tests:
      - tests/validate_framework.sh::F-0026

  - id: AC-006
    text: "ag sync detects drift between local state and reality"
    type: structural
    verify: |
      grep -q "sync" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-0125

  - id: AC-007
    text: "todo.sh captures ideas to TODO.md"
    type: structural
    verify: "test -f .agentic/lib/tools/todo.sh"
    tests:
      - tests/validate_framework.sh::F-0136

  # --- Framework Wiring Detection (added v0.78.1) ---
  - id: AC-008
    text: >
      dashboard.sh checks git core.hooksPath and sets D_FW_GIT to
      disconnected when not configured, or broken when the pre-commit
      file is missing at the configured path
    type: structural
    verify: >
      grep -q "D_FW_GIT" .agentic/lib/tools/dashboard.sh &&
      grep -q 'core.hooksPath' .agentic/lib/tools/dashboard.sh
    tests:
      - tests/validate_framework.sh::F-044-AC-001

  - id: AC-009
    text: >
      dashboard.sh checks for Claude hooks by looking for hooks.json
      in the .claude/ directory with required event types; sets
      D_FW_CLAUDE to disconnected when not found
    type: structural
    verify: >
      grep -q "D_FW_CLAUDE" .agentic/lib/tools/dashboard.sh &&
      grep -q 'hooks.json' .agentic/lib/tools/dashboard.sh
    tests:
      - tests/validate_framework.sh::F-044-AC-002

  - id: AC-010
    text: >
      dashboard.sh checks for skills directory at .claude/skills/ with
      at least one skill subdirectory; sets D_FW_SKILLS to missing or
      empty when not found
    type: structural
    verify: >
      grep -q "D_FW_SKILLS" .agentic/lib/tools/dashboard.sh &&
      grep -q '.claude/skills' .agentic/lib/tools/dashboard.sh
    tests:
      - tests/validate_framework.sh::F-044-AC-003

  - id: AC-011
    text: >
      When any D_FW_* check fails, dashboard outputs a FRAMEWORK
      DISCONNECTED warning with specific FIX commands for each
      disconnected component
    type: structural
    verify: >
      grep -q "FRAMEWORK DISCONNECTED" .agentic/lib/tools/dashboard.sh
    tests:
      - tests/validate_framework.sh::F-044-AC-004

  - id: AC-012
    text: >
      CLAUDE.md templates contain trigger-action rule: dashboard shows
      FRAMEWORK DISCONNECTED leads to offer fixes before other work;
      advises restart since hooks only load at session start
    type: structural
    verify: >
      grep -q "FRAMEWORK DISCONNECTED" CLAUDE.md &&
      grep -q "FRAMEWORK DISCONNECTED" .agentic/lib/agents/claude/CLAUDE.md
    tests:
      - tests/validate_framework.sh::F-044-AC-006
      - tests/validate_framework.sh::F-044-AC-007

  - id: AC-013
    text: >
      session-start skill includes framework disconnection as a
      priority-ordered critical flag to handle before other work
    type: structural
    verify: >
      grep -q "DISCONNECTED\|disconnected" .claude/skills/session-start/SKILL.md
    tests:
      - tests/validate_framework.sh::F-044-AC-008

nfr_refs: []
scenarios:
  - name: "Session start with interrupted work"
    given: "Stale WIP.md from previous session"
    when: "Agent starts new session"
    then: "Dashboard shows WIP warning, recovery prompted before any other work"

  - name: "Session start with disconnected framework"
    given: "Missing .claude/hooks.json or git core.hooksPath not set"
    when: "Agent starts new session"
    then: "Dashboard shows FRAMEWORK DISCONNECTED warning with fix commands"

migrations:
  - id: M-2026-04-06-001
    date: '2026-04-06'
    trigger: implementation_discovery
    reason: >
      Framework disconnection detection added to dashboard — checks git hooks,
      Claude hooks, and skills wiring at session start with fix commands
    changes:
      - "Added AC-008 through AC-013 for framework wiring detection"
      - "Added scenario for disconnected framework"
    approved_by: user
