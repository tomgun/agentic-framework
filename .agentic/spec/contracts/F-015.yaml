id: F-015
name: Session Management
lifecycle: shipped
since: v0.3.0
profile: both
protection: contract
category: session
consolidated_from: [F-0021, F-0022, F-0023, F-0024, F-0025, F-0026, F-0027, F-0125, F-0126, F-0127, F-0136, F-0145, F-0156, F-0240]

description: |
  Sessions have a structured start/end protocol. Start: check for interrupted
  work (WIP), read state files (STATUS.md, CONTEXT_PACK.md, JOURNAL.md,
  HUMAN_NEEDED.md), surface blockers. End: update journal, commit state.
  JOURNAL.md tracks decisions and outcomes. STATUS.md is the living truth.
  CONTEXT_PACK.md provides architecture context. HUMAN_NEEDED.md escalates
  blockers. Drift detection (ag sync) catches stale state. TODO.md captures
  ideas. Framework execution log tracks agent operations.

user_input: ""

assertions:
  - id: AC-001
    text: "dashboard.sh renders session status at start"
    type: structural
    verify: "test -f .agentic/lib/tools/dashboard.sh"
    tests:
      - tests/validate_framework.sh::F-015

  - id: AC-002
    text: "Session start checks for interrupted work (WIP) first"
    type: behavioral
    verify: null
    tests:
      - tests/llm/tests/001_session_start.sh

  - id: AC-003
    text: "journal.sh updates JOURNAL.md without full file rewrite"
    type: structural
    verify: "test -f .agentic/lib/tools/journal.sh"
    tests:
      - tests/validate_framework.sh::F-0023

  - id: AC-004
    text: "status.sh updates STATUS.md focus line"
    type: structural
    verify: "test -f .agentic/lib/tools/status.sh"
    tests:
      - tests/validate_framework.sh::F-0024

  - id: AC-005
    text: "HUMAN_NEEDED.md tracks blockers requiring human action"
    type: structural
    verify: "test -f .agentic/lib/tools/blocker.sh"
    tests:
      - tests/validate_framework.sh::F-0026

  - id: AC-006
    text: "ag sync detects drift between local state and reality"
    type: structural
    verify: |
      grep -q "sync" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-0125

  - id: AC-007
    text: "todo.sh captures ideas to TODO.md"
    type: structural
    verify: "test -f .agentic/lib/tools/todo.sh"
    tests:
      - tests/validate_framework.sh::F-0136

  - id: AC-008
    text: "Dashboard detects missing agent-tool hooks and shows warning"
    type: structural
    verify: |
      grep -q "HOOKS_MISSING" .agentic/lib/tools/dashboard.sh &&
      grep -q "hooks.json" .agentic/lib/tools/dashboard.sh
    tests:
      - tests/test_hooks_detection.py::TestDashboardHooksCheck

nfr_refs: []
scenarios:
  - name: "Session start with interrupted work"
    given: "Stale WIP.md from previous session"
    when: "Agent starts new session"
    then: "Dashboard shows WIP warning, recovery prompted before any other work"

  - name: "Session start with missing hooks"
    given: "Project has .claude/ dir but no .claude/hooks.json"
    when: "Agent starts new session"
    then: "Dashboard shows hooks missing warning with fix command"

migrations:
  - date: "2026-03-26"
    trigger: "Add hooks detection to dashboard (AC-008)"
    reason: "Missing hooks went undetected — no enforcement fired during plan review violation"
    approved_by: user
