id: F-022
name: Framework Architecture & Paths
lifecycle: shipped
since: v0.20.0
profile: both
protection: contract
category: architecture
consolidated_from: [F-0157, F-0158, F-0159, F-0198, F-0221]

description: |
  Central path resolution (paths.py, paths.sh) with backward compatibility.
  .agentic/ directory structure with lib/, spec/, session/, journal/ layout.
  Bootstrap mechanism via thin wrapper install.sh. ag.sh decomposed into
  modular command files. Plan durability ensures plans survive multi-tool
  scan (stored in journal/plans/ with date prefix).

user_input: ""

assertions:
  - id: AC-001
    text: "paths.py provides AgenticPaths with all framework directories"
    type: structural
    verify: |
      test -f .agentic/lib/paths.py &&
      grep -q "class AgenticPaths" .agentic/lib/paths.py
    tests:
      - tests/validate_framework.sh::F-0158

  - id: AC-002
    text: "paths.sh provides shell variables for all framework paths"
    type: structural
    verify: |
      test -f .agentic/lib/paths.sh &&
      grep -q "PROJECT_ROOT" .agentic/lib/paths.sh
    tests:
      - tests/validate_framework.sh::F-0158

  - id: AC-003
    text: "ag.sh sources modular command files from commands/"
    type: structural
    verify: |
      test -d .agentic/lib/tools/commands &&
      grep -q "COMMANDS_DIR" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-0221

  - id: AC-004
    text: "memory-check.sh: resolves MEMORY.md path via main repo root (--git-common-dir), not the worktree path returned by --show-toplevel"
    type: structural
    verify: |
      grep -q "git-common-dir" .agentic/lib/tools/memory-check.sh &&
      grep -q "MAIN_REPO_ROOT" .agentic/lib/tools/memory-check.sh
    tests:
      - tests/test_memory_check.sh

  - id: AC-005
    text: "memory-check.sh: stale advisory emits structured PATCH N/N blocks keyed by section anchors instead of a generic 're-read the file' instruction"
    type: structural
    verify: |
      test -x .agentic/lib/tools/memory-diff.sh &&
      grep -q "memory-diff.sh" .agentic/lib/tools/memory-check.sh
    tests:
      - tests/test_memory_check.sh

nfr_refs: []
migrations:
  - id: M-2026-05-15-001
    date: "2026-05-15"
    trigger: implementation_discovery
    reason: >
      T-0023: memory-check.sh was effectively a no-op due to three latent
      bugs (wrong SEED_FILE path, --show-toplevel returning worktree path
      instead of main repo path, missing memory-seed vX.Y.Z marker).
      Fixes shipped along with a new memory-diff.sh helper that emits
      section-anchored PATCH N/N blocks the agent applies as targeted
      Edit calls. Migration applied by hand because `ag contract migrate`
      requires pyyaml which is not present in the sandbox container;
      structure matches what the tool would write.
    changes:
      - "Added AC-004: memory-check.sh resolves MEMORY.md path via main repo root (--git-common-dir), not worktree path"
      - "Added AC-005: memory-check.sh stale advisory emits section-anchored PATCH N/N blocks via memory-diff.sh"
    approved_by: agent_review
