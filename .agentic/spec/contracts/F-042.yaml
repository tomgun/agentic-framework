id: F-042
name: Universal Capability Catalog
lifecycle: shipped
profile: both
protection: none
category: core
description: >
  Ensures every project tracks what it builds. When feature_tracking=yes,
  FEATURES.md is the formal catalog. When feature_tracking=no, OVERVIEW.md
  (Core Capabilities section) is the lightweight design doc. Claude hooks
  enforce updates in real-time. Profiles are presets for settings, not modes.
user_input: ''
assertions:

  # --- A. Universal Catalog ---
  - id: AC-001
    text: >
      state-files.conf lists FEATURES.md with profile `formal` and
      OVERVIEW.md with profile `all`; every project gets OVERVIEW.md,
      only feature_tracking=yes projects get FEATURES.md
    type: structural

  - id: AC-002
    text: >
      FEATURES.template.md defines a single entry format: heading (## Name),
      status (built|in_progress|planned), description, and optional Decisions
      line; no dual format, no F-XXXX IDs in the catalog itself
    type: structural

  - id: AC-003
    text: >
      All capability entries use the same three status values: `built`,
      `in_progress`, `planned`; extended lifecycle states (specced,
      criteria_set, etc.) live in contract YAML, not the catalog
    type: structural

  - id: AC-004
    text: >
      `feature.sh cap add "Name" "description"` appends a catalog entry
      to FEATURES.md with status `planned` and the given description;
      when feature_tracking=yes, also auto-assigns next F-XXXX ID for
      the contract system
    type: behavioral

  - id: AC-005
    text: >
      `feature.sh cap status "Name" built` updates the status of a
      catalog entry by matching the capability name heading
    type: behavioral

  - id: AC-006
    text: >
      `feature.sh cap add` accepts optional `--decisions "..."` flag;
      stores the decisions text as a `Decisions:` line in the FEATURES.md
      entry, capturing design rationale at registration time
    type: behavioral

  # --- B. Claude Hook Enforcement ---
  - id: AC-007
    text: >
      PostToolUse.sh sets session flag .agentic/session/.cap_updated when
      a Write/Edit tool targets a file path ending in FEATURES.md or
      OVERVIEW.md
    type: behavioral

  - id: AC-008
    text: >
      Stop.sh checks at session end: if token-events.log has W| entries
      in implementation directories AND .cap_updated flag does not exist,
      outputs advisory warning suggesting the agent update FEATURES.md
      (when it exists) or OVERVIEW.md (otherwise)
    type: behavioral

  - id: AC-009
    text: >
      UserPromptSubmit.sh injects a one-time nudge after 5+ writes to
      implementation files if .cap_updated flag does not exist; sets
      .agentic/session/.cap_nudged flag to prevent repeating
    type: behavioral

  - id: AC-010
    text: >
      catalog_enforcement setting exists in profiles.conf with preset
      defaults: discovery=advisory, formal=advisory, autonomous_formal=blocking;
      users override via STACK.md like any other setting
    type: structural

  # --- C. ag done catalog gate ---
  - id: AC-011
    text: >
      `ag done` checks .cap_updated flag and shows advisory nudge if
      the design doc was not updated; when feature_tracking=no, nudges
      to update OVERVIEW.md Core Capabilities section
    type: behavioral

  - id: AC-012
    text: >
      `ag done` checks if JOURNAL.md was modified since session start
      when feature_tracking=no; warns if no journal entry was written
    type: behavioral

  # --- D. Dashboard visibility ---
  - id: AC-013
    text: >
      dashboard.sh displays capability count line showing built, in_progress,
      and planned counts when FEATURES.md exists
    type: behavioral

  # --- E. Enforcement hierarchy in instruction files ---
  - id: AC-014
    text: >
      CLAUDE.md template, cursorrules, copilot instructions, codex
      instructions, and memory-seed all document the enforcement hierarchy:
      Claude hooks > Skills > ag commands > pre-commit > instruction files
    type: structural

  - id: AC-015
    text: >
      FRAMEWORK_DEVELOPMENT.md has an "Enforcement Architecture" section
      documenting when to use Claude hooks vs pre-commit vs instruction files
    type: structural

  # --- F. Decision Routing & Rich Work Logging ---
  - id: AC-016
    text: >
      journal.sh supports --decision flag that adds a grep-able
      **Decision**: line to the journal entry between Why and What changed
    type: structural
    verify: >
      grep -q "\-\-decision" .agentic/lib/tools/journal.sh &&
      grep -q "DECISION" .agentic/lib/tools/journal.sh

  - id: AC-017
    text: >
      CLAUDE.md template Design Tracking section contains decision routing
      table and instructs agents to log reasoning, alternatives, and
      assumptions in journal entries — not just outcomes
    type: structural
    verify: >
      grep -q "Decision routing" .agentic/lib/agents/claude/CLAUDE.md &&
      grep -q "reasoning" .agentic/lib/agents/claude/CLAUDE.md

  - id: AC-018
    text: >
      DEVELOPER_GUIDE routing table includes rows for decisions (product,
      technical, process) pointing to OVERVIEW.md + JOURNAL.md --decision,
      and user preferences pointing to cerebrum.yaml
    type: structural
    verify: >
      grep -q "Decision made\|Design decision\|decision" .agentic/lib/DEVELOPER_GUIDE.md &&
      grep -q "cerebrum" .agentic/lib/DEVELOPER_GUIDE.md

  - id: AC-019
    text: >
      Stop.sh and UserPromptSubmit.sh doc-freshness messages include
      "decisions" in the list of sections to check
    type: structural
    verify: >
      grep -q "decisions" .agentic/lib/claude-hooks/Stop.sh &&
      grep -q "decisions" .agentic/lib/claude-hooks/UserPromptSubmit.sh

  - id: AC-020
    text: >
      OVERVIEW.md template includes sections for personas (Who Uses This),
      tech stack, phases, quality constraints, and guiding principles —
      providing structured design context that agents read during planning
    type: structural
    verify: >
      grep -q "Who Uses This" .agentic/lib/init/OVERVIEW.template.md &&
      grep -q "Tech Stack" .agentic/lib/init/OVERVIEW.template.md &&
      grep -q "Phases" .agentic/lib/init/OVERVIEW.template.md

  - id: AC-021
    text: >
      completing-work skill instructs agents to update OVERVIEW.md and
      log decisions with journal.sh --decision before running ag done
    type: structural
    verify: >
      grep -q "decision" .claude/skills/completing-work/SKILL.md

  - id: AC-022
    text: >
      When a design choice is made during implementation, the agent logs
      it with reasoning and alternatives in JOURNAL.md (using --decision
      flag) and updates OVERVIEW.md to reflect the current state
    type: behavioral
    tests:
      - tests/llm/tests/108_decision_logging_with_reasoning.sh
      - tests/llm/tests/109_overview_updated_after_decision.sh

  - id: AC-023
    text: >
      Decision routing is documented in all agent instruction files
      (cursorrules, copilot, codex, memory-seed) pointing to OVERVIEW.md
      for current state and JOURNAL.md --decision for history
    type: structural
    verify: >
      grep -q "Decision routing" .agentic/lib/agents/cursor/cursorrules.txt &&
      grep -q "Decision routing" .agentic/lib/agents/copilot/copilot-instructions.md &&
      grep -q "Decision routing" .agentic/lib/agents/codex/codex-instructions.md

migrations:
  - id: M-2026-04-06-001
    date: '2026-04-06'
    trigger: implementation_discovery
    reason: >
      Decision routing and rich work logging: agents had no clear guidance
      on where to record decisions or how to log reasoning. Added journal.sh
      --decision flag, routing table to instruction files, OVERVIEW.md
      template enrichment (personas, tech stack, phases), and decision
      capture to completing-work skill.
    changes:
      - "Added AC-016 through AC-023 for decision routing and work logging"
      - "OVERVIEW.md template: added Who Uses This, Tech Stack, Phases, Quality sections"
      - "journal.sh: added --decision flag for grep-able decision entries"
      - "All instruction files: added decision routing one-liner"
    approved_by: user
