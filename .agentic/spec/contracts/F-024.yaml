id: F-024
name: Git Workflow & PR Management
lifecycle: shipped
since: v0.8.0
profile: both
protection: contract
category: git-workflow
consolidated_from: [F-0096, F-0097, F-0182, F-0192, F-0196, F-0235, F-0239]

description: |
  PR-based workflow is the default for formal profile. Feature branches follow
  naming convention feature/F-####-description. ag flush commits state files
  without triggering full pre-commit gates. Critical review agent provides
  automated code review. Review subagent delegation handles plan and regression
  reviews. Auto-review after PR creation surfaces issues early. Post-merge
  workflow enforcement ensures completion steps are followed.

user_input: ""

assertions:
  - id: AC-001
    text: "STACK template defaults to git_workflow: pull_request"
    type: structural
    verify: |
      grep -q "pull_request" .agentic/lib/init/STACK.template.md
    tests:
      - tests/validate_framework.sh::F-024

  - id: AC-002
    text: "Branch policy check exists in pre-commit"
    type: structural
    verify: |
      grep -q "branch policy\|Branch policy" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-0115

  - id: AC-003
    text: "ag flush commits state files with controlled bypass"
    type: structural
    verify: |
      grep -q "flush" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-0196

  - id: AC-004
    text: "Post-merge workflow enforcement (ag done triggers completion)"
    type: behavioral
    verify: null
    tests:
      - tests/llm/tests/096_pr_workflow.sh

nfr_refs: []
scenarios:
  - name: "PR workflow blocks direct main commit"
    given: "Project with git_workflow: pull_request in STACK.md"
    when: "Developer tries to commit directly to main"
    then: "Pre-commit blocks with guidance to create feature branch"

migrations: []
