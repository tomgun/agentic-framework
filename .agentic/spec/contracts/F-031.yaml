id: F-031
name: Spec System Overhaul — YAML Contracts
lifecycle: shipped
profile: formal
protection: contract
category: core-workflow
description: 'Replace markdown acceptance criteria with YAML contract specifications.

  Contracts are machine-parseable, have testable assertions with verify commands,

  track migrations for shipped spec changes, and support a user_input field

  that makes specs the control interface for driving changes.

  '
user_input: ''
assertions:
- id: AC-001
  text: Contract schema exists at .agentic/lib/schemas/contract.schema.json
  type: structural
  verify: test -f .agentic/lib/schemas/contract.schema.json
  tests:
  - tests/validate_framework.sh::F-031
- id: AC-002
  text: Contract parser (contracts.py) loads and validates YAML contracts
  type: structural
  verify: 'python3 -c "

    import sys; sys.path.insert(0, ''.agentic/lib'')

    from contracts import load_contract, validate_contract

    from pathlib import Path

    c = load_contract(Path(''.agentic/spec/contracts/F-031.yaml''))

    assert c.id == ''F-031''

    assert len(c.assertions) > 0

    errors = validate_contract(c)

    assert not errors, errors

    "

    '
  tests:
  - tests/test_contracts.py::test_load_contract
  - tests/test_contracts.py::test_validate_contract
- id: AC-003
  text: ag contract command dispatches subcommands (check, list, validate, create,
    etc.)
  type: structural
  verify: 'bash .agentic/lib/tools/ag.sh contract help 2>&1 | grep -q "YAML contract
    management"

    '
  tests:
  - tests/validate_framework.sh::F-031
- id: AC-004
  text: verify-contracts.sh exists and is executable
  type: structural
  verify: test -x .agentic/lib/tools/verify-contracts.sh
  tests:
  - tests/validate_framework.sh::F-031
- id: AC-005
  text: paths.py and paths.sh resolve contracts_dir
  type: structural
  verify: 'python3 -c "

    import sys; sys.path.insert(0, ''.agentic/lib'')

    from paths import get_paths; from pathlib import Path

    p = get_paths(Path(''.''))

    assert ''contracts'' in str(p.contracts_dir)

    " && bash -c ''source .agentic/lib/paths.sh && [[ -n "$CONTRACTS_DIR" ]]''

    '
  tests:
  - tests/validate_framework.sh::F-031
- id: AC-006
  text: Pre-commit blocks shipped contract changes without migration entry
  type: behavioral
- id: AC-007
  text: ag contract create scaffolds a minimal valid draft contract
  type: structural
  verify: "tmpdir=$(mktemp -d) &&\nmkdir -p \"$tmpdir/.agentic/spec/contracts\" &&\n\
    CONTRACTS_DIR=\"$tmpdir/.agentic/spec/contracts\" \\\nPYTHONPATH=\".agentic/lib\"\
    \ python3 -c \"\nfrom pathlib import Path\nfrom contracts import Contract, Assertion,\
    \ save_contract, validate_contract\nc = Contract(id='F-9999', name='Test', lifecycle='exploring',\n\
    \             description='Test contract for validation',\n             assertions=[Assertion(id='AC-001',\
    \ text='Test assertion', type='structural', draft=True)])\nsave_contract(c, Path('$tmpdir/.agentic/spec/contracts/F-9999.yaml'))\n\
    c2 = __import__('contracts').load_contract(Path('$tmpdir/.agentic/spec/contracts/F-9999.yaml'))\n\
    errors = validate_contract(c2)\nassert not errors, errors\n\" && rm -rf \"$tmpdir\"\
    \n"
  tests:
  - tests/test_contracts.py::test_create_contract
  - id: AC-008
    text: ag contract promote F-XXXX [AC-ID] promotes unshipped assertions to shipped
    type: structural
    verify: 'bash .agentic/lib/tools/ag.sh contract help 2>&1 | grep -q "promote"

      '
  - id: AC-009
    text: verify-contracts.sh surfaces unshipped assertion counts after summary output
    type: structural
    verify: 'grep -q "unshipped_details" .agentic/lib/tools/verify-contracts.sh

      '
  - id: AC-010
    text: ag done warns (advisory) when shipped/shipping/ongoing contracts have unshipped
      assertions
    type: structural
    verify: 'grep -q "Gate 4.*Planned assertion advisory" .agentic/lib/tools/commands/done.sh

      '
  - id: AC-011
    text: ag sync detects assertion status drift on shipped contracts with unshipped
      assertions
    type: structural
    verify: 'grep -q "phase_assertion_status" .agentic/lib/tools/sync.sh

      '
scenarios:
- name: Create and validate a contract
  given: A formal-profile project with spec/contracts/ directory
  when: Run ag contract create F-0099
  then: Draft YAML contract created with required fields and one draft assertion
- name: Run verification on shipped contract
  given: A shipped contract with structural assertions and verify commands
  when: Run ag contract check F-XXXX
  then: Each verify command runs, results reported as pass/fail per assertion
- name: Detect pending user input
  given: A contract with non-empty user_input field
  when: Run ag contract pending
  then: Contract listed with input preview
- name: Promote planned assertions after implementation
  given: A shipped contract with planned assertions that have been implemented
  when: Run ag contract promote F-XXXX
  then: All unshipped assertions promoted to shipped, contract saved
migrations:
- id: M-2026-03-22-001
  date: '2026-03-22'
  trigger: user_request
  reason: 'Feature shipped: Phase 3 merged via PR #195, lifecycle → shipped'
  changes: []
  approved_by: user
- id: M-2026-04-09-001
  date: '2026-04-09'
  trigger: implementation_discovery
  reason: 'Planned assertions were permanently invisible — no gate or workflow surfaced
    them. Added promote command, verify summary, ag done advisory, ag sync drift detection.'
  changes:
  - 'Added AC-008: ag contract promote command'
  - 'Added AC-009: verify-contracts.sh unshipped summary'
  - 'Added AC-010: ag done Gate 4 planned assertion advisory'
  - 'Added AC-011: ag sync Phase 4b assertion status drift'
  - 'Added scenario: Promote planned assertions after implementation'
  approved_by: user
