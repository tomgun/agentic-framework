id: F-006
name: Backlog & Work Queue
lifecycle: shipped
since: v0.40.0
profile: formal
protection: contract
category: core-workflow
consolidated_from: [F-0190, F-0201, F-0202, F-0205]

description: |
  Ordered work queue in BACKLOG.json. ag backlog manages priority ordering.
  Vision-to-backlog pipeline (ag kickoff) generates features from high-level
  vision. ag preview shows what a feature would look like before committing.
  Discovery-to-formal migration (ag formalize) promotes lightweight tracking
  to full spec contracts.

user_input: ""

assertions:
  - id: AC-001
    text: "BACKLOG.json exists and ag backlog command works"
    type: structural
    verify: |
      test -f .agentic/BACKLOG.json &&
      grep -q "backlog" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-006

  - id: AC-002
    text: "ag kickoff generates features from vision"
    type: structural
    verify: |
      grep -q "kickoff" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-0201

  - id: AC-003
    text: "ag formalize promotes discovery to formal"
    type: structural
    verify: |
      grep -q "formalize" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-0205

nfr_refs: []
migrations: []
