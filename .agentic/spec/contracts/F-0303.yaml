id: F-0303
title: Plan-Derived Work Items (Multi-Session Phase Tracking)
lifecycle: active
protection: none

assertions:
  - id: AC-001
    description: Plans with ## Phase N headers produce tasks.yaml on approval
    type: structural
    verify: "test -f .agentic/lib/auto/phases.py"
  - id: AC-002
    description: ag phase list/done/active/drop/sync CLI works
    verify: "bash .agentic/lib/tools/ag.sh phase help 2>/dev/null | grep -q 'list F-XXXX'"
  - id: AC-003
    description: ag done blocks when phases are incomplete
    verify: "grep -q 'Phase completion gate' .agentic/lib/tools/commands/done.sh"
  - id: AC-004
    description: Dashboard shows phase progress for current backlog item
    verify: "grep -q 'Phase progress' .agentic/lib/tools/dashboard.sh"
  - id: AC-005
    description: tasks.yaml cleaned up after feature ships
    verify: "grep -q 'Phase tracking cleanup' .agentic/lib/tools/commands/done.sh"
  - id: AC-006
    description: 28 unit tests pass
    verify: "python3 -m pytest tests/test_phases.py -q 2>/dev/null | grep -q '28 passed'"
