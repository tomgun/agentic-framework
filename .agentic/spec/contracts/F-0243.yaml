tags: [research, internal]
description: |
  Empirical comparison harness for discovery/formal/autonomous_formal profiles.
  Runs the same build scenario N times per tier, collects structured metrics
  (spec coverage, test count, commit quality, wall time, violation rate), and
  produces a comparison report. Research item: concludes when profile comparison
  is documented.

