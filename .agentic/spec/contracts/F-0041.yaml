id: F-0041
name: Token & Resource Efficiency
lifecycle: shipped
since: v0.4.0
profile: both
protection: contract
category: tooling
consolidated_from: [F-0041, F-0071, F-0102, F-0103, F-0112, F-0237, F-0238, F-0244]

description: |
  Token-efficient update scripts (journal.sh, status.sh, feature.sh, etc.)
  modify state files without full file rewrites. Modular guidelines load
  just-in-time via skills rather than bloating instruction files. Agent mode
  selection balances quality vs cost. Memory-seed optimization reduces
  redundancy. Session log analysis tracks token usage patterns. Hooks-first
  architecture simplifies framework by moving enforcement to git/tool hooks.

user_input: ""

assertions:
  - id: AC-001
    text: "Token-efficient scripts exist (journal.sh, status.sh, feature.sh, blocker.sh, todo.sh)"
    type: structural
    verify: |
      test -f .agentic/lib/tools/journal.sh &&
      test -f .agentic/lib/tools/status.sh &&
      test -f .agentic/lib/tools/feature.sh &&
      test -f .agentic/lib/tools/blocker.sh &&
      test -f .agentic/lib/tools/todo.sh
    tests:
      - tests/validate_framework.sh::F-0041

  - id: AC-002
    text: "Skills-primary architecture loads guidance just-in-time"
    type: structural
    verify: "test -d .agentic/lib/agents/claude/skills"
    tests:
      - tests/validate_framework.sh::F-0143

