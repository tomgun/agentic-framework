id: F-032
name: Plan-Derived Work Items (Multi-Session Phase Tracking)
lifecycle: shipped
profile: both
protection: contract
category: core-workflow
description: 'Approved multi-phase plans produce a trackable work structure (tasks.yaml)
  that surfaces progress in the dashboard and gates feature completion.

  '
user_input: ''
assertions:
- id: AC-001
  text: Plans with
  type: structural
  verify: test -f .agentic/lib/auto/phases.py
- id: AC-002
  text: ag phase list/done/active/drop/sync CLI works
  type: structural
  verify: bash .agentic/lib/tools/ag.sh phase help 2>/dev/null | grep -q 'list F-XXXX'
- id: AC-003
  text: ag done blocks when phases are incomplete
  type: structural
  verify: grep -q 'Phase completion gate' .agentic/lib/tools/commands/done.sh
- id: AC-004
  text: Dashboard shows phase progress for current backlog item
  type: structural
  verify: grep -q 'Phase progress' .agentic/lib/tools/dashboard.sh
- id: AC-005
  text: tasks.yaml cleaned up after feature ships
  type: structural
  verify: grep -q 'Phase tracking cleanup' .agentic/lib/tools/commands/done.sh
- id: AC-006
  text: 28 unit tests pass
  type: structural
  verify: python3 -m pytest tests/test_phases.py -q 2>/dev/null | grep -q '28 passed'
  tests:
  - tests/test_phases.py
