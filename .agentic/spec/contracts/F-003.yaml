id: F-003
name: Feature Tracking & Lifecycle
lifecycle: shipped
since: v0.1.0
profile: formal
protection: contract
category: core-workflow
consolidated_from: [F-0004, F-0042, F-0078, F-0109, F-0110, F-0177, F-0178, F-0193, F-0197]

description: |
  Features have a formal lifecycle tracked in FEATURES.md with states from
  planned through shipped. A state machine enforces valid transitions and
  gate checks. feature.sh provides token-efficient updates. Feature hierarchy
  supports parent-child relationships for epics. Registry integrity checks
  validate FEATURES.md consistency. Feature ID patterns are centralized in
  ids.py/ids.sh — all parsing and validation imports from there.

user_input: ""

assertions:
  - id: AC-001
    text: "FEATURES.md tracks features with Status, Category, Priority fields"
    type: structural
    verify: |
      grep -q "Status" .agentic/spec/FEATURES.md &&
      grep -q "Category" .agentic/spec/FEATURES.md
    tests:
      - tests/validate_framework.sh::F-003

  - id: AC-002
    text: "feature.sh updates feature status without full file rewrite"
    type: structural
    verify: "test -f .agentic/lib/tools/feature.sh"
    tests:
      - tests/validate_framework.sh::F-003

  - id: AC-003
    text: "State machine enforces valid lifecycle transitions"
    type: structural
    verify: |
      test -f .agentic/lib/auto/state_machine.py ||
      test -f .agentic/state_machine_af.yaml
    tests:
      - tests/validate_framework.sh::F-0177

  - id: AC-004
    text: "ag transition command advances feature through lifecycle states"
    type: structural
    verify: |
      grep -q "transition" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-0177

  - id: AC-005
    text: "Status downgrade protection blocks shipped→in_progress regression"
    type: structural
    verify: |
      grep -q "Status downgrade" .agentic/lib/hooks/pre-commit-check.sh ||
      grep -q "status.*downgrade" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-0178

  - id: AC-006
    text: "Feature ID patterns centralized in ids.py/ids.sh — no hardcoded patterns in consuming code"
    type: structural
    verify: |
      test -f .agentic/lib/ids.py && test -f .agentic/lib/ids.sh
    tests:
      - tests/validate_framework.sh::F-003
      - tests/test_ids.py

nfr_refs: []
scenarios:
  - name: "Feature lifecycle from planned to shipped"
    given: "F-0099 in FEATURES.md with status: planned"
    when: "Work progresses through plan → implement → verify → ship"
    then: "Status advances through each state; gates block invalid skips"

migrations: []
