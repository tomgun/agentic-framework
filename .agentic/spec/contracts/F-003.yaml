id: F-003
name: Feature Tracking & Lifecycle
lifecycle: shipped
since: v0.1.0
profile: formal
protection: contract
category: core-workflow
consolidated_from: [F-0004, F-0042, F-0078, F-0109, F-0110, F-0177, F-0178, F-0193, F-0197]

description: |
  Features have a formal lifecycle tracked in FEATURES.md with states from
  planned through shipped. A state machine enforces valid transitions and
  gate checks. feature.sh provides token-efficient updates. Feature hierarchy
  supports parent-child relationships for epics. Registry integrity checks
  validate FEATURES.md consistency. Feature ID patterns are centralized in
  ids.py/ids.sh — all parsing and validation imports from there.

user_input: ""

assertions:
  - id: AC-001
    text: "FEATURES.md tracks features with Status, Category, Priority fields"
    type: structural
    verify: |
      grep -q "Status" .agentic/spec/FEATURES.md &&
      grep -q "Category" .agentic/spec/FEATURES.md
    tests:
      - tests/validate_framework.sh::F-003

  - id: AC-002
    text: "feature.sh updates feature status without full file rewrite"
    type: structural
    verify: "test -f .agentic/lib/tools/feature.sh"
    tests:
      - tests/validate_framework.sh::F-003

  - id: AC-003
    text: "State machine enforces valid lifecycle transitions"
    type: structural
    verify: |
      test -f .agentic/lib/auto/state_machine.py ||
      test -f .agentic/state_machine_af.yaml
    tests:
      - tests/validate_framework.sh::F-0177

  - id: AC-004
    text: "ag transition command advances feature through lifecycle states"
    type: structural
    verify: |
      grep -q "transition" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-0177

  - id: AC-005
    text: "Status downgrade protection blocks shipped→in_progress regression"
    type: structural
    verify: |
      grep -q "Status downgrade" .agentic/lib/hooks/pre-commit-check.sh ||
      grep -q "status.*downgrade" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-0178

  - id: AC-006
    text: "Feature ID patterns centralized in ids.py/ids.sh — no hardcoded patterns in consuming code"
    type: structural
    verify: |
      test -f .agentic/lib/ids.py && test -f .agentic/lib/ids.sh
    tests:
      - tests/validate_framework.sh::F-003
      - tests/test_ids.py

  - id: AC-007
    text: "plan-scan extracts F-IDs from body text when heading/metadata patterns miss (Pattern 4 fallback)"
    type: structural
    verify: |
      grep -q "Pattern 4" .agentic/lib/tools/plan-scan.sh
    tests:
      - tests/test_plan_review_hooks.sh::plan-scan-pattern-4

  - id: AC-008
    text: "Hook failure path gives auto-continue instructions, not 'save manually'"
    type: behavioral
    verify: |
      ! grep -q "Save your plan manually" .agentic/lib/hooks/shared/on-plan-mode-exit.sh
    tests:
      - tests/test_plan_review_hooks.sh::failure-path-auto-continue

  - id: AC-009
    text: "SessionStart hook detects orphan plans in ephemeral locations (pull safety net)"
    type: structural
    verify: |
      grep -q "plan-scan" .agentic/lib/claude-hooks/SessionStart.sh &&
      grep -q "unsaved plan" .agentic/lib/claude-hooks/SessionStart.sh
    tests:
      - tests/test_plan_review_hooks.sh::session-start-orphan-detection

  - id: AC-010
    text: "on-plan-mode-exit.sh creates review-pending sentinel even for ad-hoc plans without feature ID"
    type: structural
    verify: |
      grep -q 'review-pending-.*FEATURE_ID' .agentic/lib/hooks/shared/on-plan-mode-exit.sh &&
      ! grep -q 'if.*FEATURE_ID.*!=.*F-XXXX.*then' .agentic/lib/hooks/shared/on-plan-mode-exit.sh

nfr_refs: []
scenarios:
  - name: "Feature lifecycle from planned to shipped"
    given: "F-0099 in FEATURES.md with status: planned"
    when: "Work progresses through plan → implement → verify → ship"
    then: "Status advances through each state; gates block invalid skips"
  - name: "Ad-hoc plan triggers enforcement"
    given: "Plan mode exited with a plan that has no F-XXXX in filename"
    when: "on-plan-mode-exit.sh runs"
    then: "review-pending sentinel is created; code edits blocked until review or ag plan skip"

migrations:
- id: M-2026-04-09-001
  date: '2026-04-09'
  trigger: implementation_discovery
  reason: 'Ad-hoc plans (no feature ID) silently bypassed all enforcement — no sentinel created, no PreToolUse block.'
  changes:
  - 'Added AC-010: on-plan-mode-exit.sh creates sentinel for ad-hoc plans'
  - 'Added scenario: Ad-hoc plan triggers enforcement'
  approved_by: user
