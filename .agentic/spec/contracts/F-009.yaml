id: F-009
name: Pre-Commit Quality Gates
lifecycle: shipped
since: v0.2.0
profile: both
protection: contract
category: quality
consolidated_from: [F-0016, F-0017, F-0091, F-0092, F-0114, F-0115, F-0154, F-0155, F-0229, F-0301]

description: |
  Pre-commit hook validates project state before allowing commits. Checks
  include WIP completion, shipped feature AC coverage, journal freshness,
  batch size limits, test execution, complexity bounds, branch policy,
  shipped spec protection, and annotation enforcement. Gate-based verification
  uses phase detection to run context-appropriate checks. The completion gate
  blocks new work when prior features are unshipped.

user_input: ""

assertions:
  - id: AC-001
    text: "pre-commit-check.sh exists and is sourced by git hooks"
    type: structural
    verify: |
      test -f .agentic/lib/hooks/pre-commit-check.sh &&
      test -f .agentic/hooks/pre-commit
    tests:
      - tests/validate_framework.sh::F-009

  - id: AC-002
    text: "Commit blocked if WIP.md exists (incomplete work)"
    type: structural
    verify: |
      grep -q "WIP.md" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-009

  - id: AC-003
    text: "Commit blocked if shipped features lack acceptance criteria"
    type: structural
    verify: |
      grep -q "shipped features" .agentic/lib/hooks/pre-commit-check.sh ||
      grep -q "acceptance criteria" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-009

  - id: AC-004
    text: "Branch policy blocks direct commit to main in PR workflow mode"
    type: structural
    verify: |
      grep -q "branch policy\|Branch policy\|PR workflow" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-0115

  - id: AC-005
    text: "Batch size warning for >10 files staged"
    type: structural
    verify: |
      grep -q "files staged\|Batch size\|max.*10" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-009

  - id: AC-006
    text: "Shipped spec changes require migration entry"
    type: structural
    verify: |
      grep -q "Shipped spec changes\|shipped.*spec.*migration" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-009

  - id: AC-007
    text: "YAML contract protection blocks shipped contract changes without migration"
    type: structural
    verify: |
      grep -q "contract protection\|YAML contract" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-031

nfr_refs: []
scenarios:
  - name: "All gates pass on clean commit"
    given: "Feature branch, all work complete, journal updated"
    when: "Developer runs git commit"
    then: "All checks pass, commit succeeds"

  - name: "Gate blocks incomplete work"
    given: "WIP.md exists in session directory"
    when: "Developer runs git commit"
    then: "Commit blocked with clear message about incomplete work"

migrations: []
