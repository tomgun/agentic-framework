id: F-0157
name: Framework Architecture & Paths
lifecycle: shipped
since: v0.20.0
profile: both
protection: contract
category: architecture
consolidated_from: [F-0157, F-0158, F-0159, F-0198, F-0221]

description: |
  Central path resolution (paths.py, paths.sh) with backward compatibility.
  .agentic/ directory structure with lib/, spec/, session/, journal/ layout.
  Bootstrap mechanism via thin wrapper install.sh. ag.sh decomposed into
  modular command files. Plan durability ensures plans survive multi-tool
  scan (stored in journal/plans/ with date prefix).

user_input: ""

assertions:
  - id: AC-001
    text: "paths.py provides AgenticPaths with all framework directories"
    type: structural
    verify: |
      test -f .agentic/lib/paths.py &&
      grep -q "class AgenticPaths" .agentic/lib/paths.py
    tests:
      - tests/validate_framework.sh::F-0158

  - id: AC-002
    text: "paths.sh provides shell variables for all framework paths"
    type: structural
    verify: |
      test -f .agentic/lib/paths.sh &&
      grep -q "PROJECT_ROOT" .agentic/lib/paths.sh
    tests:
      - tests/validate_framework.sh::F-0158

  - id: AC-003
    text: "ag.sh sources modular command files from commands/"
    type: structural
    verify: |
      test -d .agentic/lib/tools/commands &&
      grep -q "COMMANDS_DIR" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-0221

nfr_refs: []
migrations: []
