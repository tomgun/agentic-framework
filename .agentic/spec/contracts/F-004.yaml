id: F-004
name: Plan & Design Review
lifecycle: shipped
since: v0.10.0
profile: formal
protection: contract
category: core-workflow
consolidated_from: [F-0120, F-0133, F-0150, F-0191, F-0236]

description: |
  Iterative plan-review loop with dialectical mechanism (Critic + Advocate
  agents in fresh context). Plans are durable artifacts saved to journal/plans/.
  Execution order and parallelization markers guide implementation. Autonomous
  convergence loop with expert reviewers auto-resolves when possible. Manual
  convergence presents synthesis to user for decision. Optional design phase
  (designed state) between planned and specced, controlled by design_phase
  setting (off|optional|required).

user_input: ""

assertions:
  - id: AC-001
    text: "Plan review skill or workflow exists"
    type: structural
    verify: |
      test -f .agentic/lib/agents/claude/skills/planning-features/SKILL.md ||
      test -f .agentic/lib/workflows/plan_review.md
    tests:
      - tests/validate_framework.sh::F-004

  - id: AC-002
    text: "Plans directory exists for durable plan artifacts"
    type: structural
    verify: "test -d .agentic/journal/plans"
    tests:
      - tests/validate_framework.sh::F-0133

  - id: AC-003
    text: "Approved plan required gate in pre-commit (when plan_review_enabled)"
    type: structural
    verify: |
      grep -q "plan.*required\|Approved plan" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-0191

  - id: AC-004
    text: "DESIGNED state exists in FeatureState enum between PLANNED and SPECCED"
    type: structural
    verify: |
      python3 -c "
      import sys; sys.path.insert(0, '.agentic/lib'); sys.path.insert(0, '.agentic/lib/auto')
      from state_machine import FeatureState, STATE_ORDER
      assert hasattr(FeatureState, 'DESIGNED')
      idx_d = STATE_ORDER.index(FeatureState.DESIGNED)
      idx_p = STATE_ORDER.index(FeatureState.PLANNED)
      idx_s = STATE_ORDER.index(FeatureState.SPECCED)
      assert idx_p < idx_d < idx_s, f'Order wrong: P={idx_p} D={idx_d} S={idx_s}'
      "
    tests:
      - tests/test_state_machine.py::TestDesignedState::test_designed_in_state_order

  - id: AC-005
    text: "design_phase setting controls transition availability (off/optional/required)"
    type: structural
    verify: |
      grep -q "design_phase" .agentic/lib/presets/profiles.conf &&
      grep -q "design_phase" .agentic/lib/auto/gates.py
    tests:
      - tests/test_state_machine.py::TestDesignedState::test_planned_to_designed_blocked_when_off
      - tests/test_state_machine.py::TestDesignedState::test_planned_to_specced_blocked_when_required

  - id: AC-006
    text: "Gate checks for design artifacts (ADR or design.md)"
    type: structural
    verify: |
      grep -q "gate_designed_to_specced" .agentic/lib/auto/gates.py
    tests:
      - tests/test_state_machine.py::TestDesignedState::test_design_gate_checks_artifacts
      - tests/test_state_machine.py::TestDesignedState::test_design_gate_blocks_without_artifacts

  - id: AC-007
    text: "Contract round-trip fidelity — designed state survives write/read"
    type: structural
    verify: |
      python3 -c "
      import sys; sys.path.insert(0, '.agentic/lib'); sys.path.insert(0, '.agentic/lib/auto')
      from state_machine import LIFECYCLE_TO_STATE, STATE_TO_LIFECYCLE, FeatureState
      assert STATE_TO_LIFECYCLE[FeatureState.DESIGNED] == 'designing'
      assert LIFECYCLE_TO_STATE['designing'] == FeatureState.DESIGNED
      "
    tests:
      - tests/test_state_machine.py::TestDesignedState::test_contract_roundtrip_designed

  - id: AC-008
    text: "gate.py check_plan_review_evidence blocks code edits for ad-hoc plans (non-feature-ID sentinels)"
    type: structural
    verify: |
      grep -q 'missing_evidence.append.*adhoc' .agentic/lib/gate.py

nfr_refs: []
migrations:
- id: M-2026-04-09-001
  date: '2026-04-09'
  trigger: implementation_discovery
  reason: 'Ad-hoc plans with non-feature-ID sentinels were silently skipped by check_plan_review_evidence.'
  changes:
  - 'Added AC-008: gate.py blocks code edits for ad-hoc plan sentinels'
  approved_by: user
