id: F-004
name: Plan & Design Review
lifecycle: shipped
since: v0.10.0
profile: formal
protection: contract
category: core-workflow
consolidated_from: [F-0120, F-0133, F-0150, F-0191, F-0236]

description: |
  Iterative plan-review loop with dialectical mechanism (Critic + Advocate
  agents in fresh context). Plans are durable artifacts saved to journal/plans/.
  Execution order and parallelization markers guide implementation. Autonomous
  convergence loop with expert reviewers auto-resolves when possible. Manual
  convergence presents synthesis to user for decision.

user_input: ""

assertions:
  - id: AC-001
    text: "Plan review skill or workflow exists"
    type: structural
    verify: |
      test -f .agentic/lib/agents/claude/skills/planning-features/SKILL.md ||
      test -f .agentic/lib/workflows/plan_review.md
    tests:
      - tests/validate_framework.sh::F-004

  - id: AC-002
    text: "Plans directory exists for durable plan artifacts"
    type: structural
    verify: "test -d .agentic/journal/plans"
    tests:
      - tests/validate_framework.sh::F-0133

  - id: AC-003
    text: "Approved plan required gate in pre-commit (when plan_review_enabled)"
    type: structural
    verify: |
      grep -q "plan.*required\|Approved plan" .agentic/lib/hooks/pre-commit-check.sh
    tests:
      - tests/validate_framework.sh::F-0191

nfr_refs: []
migrations: []
