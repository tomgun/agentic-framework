id: F-018
name: Coordination Server
lifecycle: shipped
since: v0.35.0
profile: both
protection: advisory
category: multi-agent
consolidated_from: [F-0185, F-0187]

description: |
  HTTP JSON-RPC coordination server (port 4185, bearer auth) for multi-agent
  orchestration. Supports remote status, task assignment, agent registration.
  Multi-repo umbrella coordinates across repository boundaries.

user_input: ""

assertions:
  - id: AC-001
    text: "ag coord command exists"
    type: structural
    verify: |
      grep -q "coord" .agentic/lib/tools/ag.sh
    tests:
      - tests/validate_framework.sh::F-018

  # --- MCP Transport (consolidated from F-037) ---
  - id: AC-002
    text: >
      MCP protocol server wraps existing coord tools for tool-native agent
      integration via Model Context Protocol
    type: structural
    verify: |
      test -f .agentic/lib/auto/mcp_server.py &&
      test -f .agentic/lib/auto/mcp_tool_defs.py &&
      test -f .agentic/lib/auto/mcp_start.sh
    tests:
      - tests/validate_framework.sh::F-018-MCP-001
      - tests/validate_framework.sh::F-018-MCP-002
      - tests/validate_framework.sh::F-018-MCP-003
      - tests/test_mcp_server.py

  - id: AC-003
    text: >
      ag mcp start/status lifecycle commands for MCP server management
      (stop is N/A for stdio transport — IDE manages process lifecycle)
    type: structural
    verify: |
      grep -q 'mcp)' .agentic/lib/tools/ag.sh &&
      grep -q 'cmd_mcp' .agentic/lib/tools/commands/operations.sh
    tests:
      - tests/validate_framework.sh::F-018-MCP-005

  - id: AC-004
    text: >
      Graceful degradation — framework operates normally without MCP server
      running, falling back to HTTP or file-based coordination
    type: behavioral
    verify: |
      bash .agentic/lib/tools/ag.sh status 2>/dev/null; test $? -le 1

  # --- Multi-Repo Orchestration (consolidated from F-038) ---
  - id: AC-005
    text: >
      Cross-repo shared backlog queries via umbrella resolution allow
      scheduling work across component repositories
    type: behavioral
    status: planned

  - id: AC-006
    text: >
      ag status --umbrella shows unified status across component repos
    type: structural
    status: planned

  - id: AC-007
    text: >
      Umbrella auto-syncs component repos before orchestration begins
    type: behavioral
    status: planned

  # --- Task Delegation (context-optimized subagent spawning) ---
  - id: AC-008
    text: >
      5 task delegation MCP tools (list_acs, get_task_brief, save_progress,
      get_next_action, get_delegation_prompt) enable context-optimized
      subagent spawning via Claude Code's native Agent tool
    type: structural
    verify: |
      python3 -c "
      import sys; sys.path.insert(0, '.agentic/lib')
      from auto.coord_tools import TOOLS
      expected = {'list_acs','get_task_brief','save_progress','get_next_action','get_delegation_prompt'}
      assert expected.issubset(set(TOOLS.keys())), f'Missing: {expected - set(TOOLS.keys())}'
      "
    tests:
      - tests/test_coord_server.py
      - tests/test_mcp_server.py
      - tests/test_mcp_e2e.py

  - id: AC-009
    text: >
      MCP server auto-registered in settings-template.json so ag auto init
      wires it into Claude Code sessions
    type: structural
    verify: |
      python3 -c "
      import json
      d = json.load(open('.agentic/lib/auto/settings-template.json'))
      assert 'mcpServers' in d
      assert 'agentic-coord' in d['mcpServers']
      "

  - id: AC-010
    text: >
      Feature ID validation (is_valid_feature_id) prevents path traversal
      in all 5 delegation tools
    type: structural
    verify: |
      grep -c '_validate_feature_id' .agentic/lib/auto/coord_tools.py | grep -q '[5-9]'
    tests:
      - tests/test_coord_server.py::TestGetNextAction::test_invalid_feature_id_rejected
      - tests/test_mcp_e2e.py::TestRegressionAndEdgeCases::test_invalid_feature_id_rejected

nfr_refs: []
migrations:
  - id: M-001
    date: "2026-04-03"
    trigger: consolidation
    reason: >
      F-037 (MCP Coordination Server) and F-038 (Multi-Repo Umbrella)
      consolidated into F-018. These describe enhancements to shipped
      coordination infrastructure, not new capabilities.
    changes:
      - "Added AC-002..AC-004 (MCP transport, from F-037) with status: planned"
      - "Added AC-005..AC-007 (multi-repo orchestration, from F-038) with status: planned"
    approved_by: user
