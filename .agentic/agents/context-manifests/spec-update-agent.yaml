# Context Manifest: Spec Update Agent
# Token budget: ~3000 tokens
# Purpose: Update specs after implementation (FEATURES.md, acceptance criteria)

role: spec-update-agent
token_budget: 3000

# Files to always load
required:
  - spec/FEATURES.md                    # Feature registry to update
  - spec/acceptance/{feature_id}.md   # Acceptance criteria to verify/update

# Files to load if available and budget permits
optional:
  - CONTEXT_PACK.md                     # May need to update architecture notes
  - STATUS.md                           # Update current focus

# Files to explicitly skip (save tokens)
exclude:
  - src/                                # Code details not needed
  - tests/                              # Test details not needed
  - docs/research/                      # Research not relevant
  - JOURNAL.md                          # History not needed
  - .agentic/quality/                   # Standards not relevant
