name: "Todo App"
description: "CRUD todo app with REST API and persistence"
type: single
timeout: 3600

stack:
  language: python
  framework: fastapi
  test_runner: pytest

vision: |
  Build a simple todo application with:
  - REST API (CRUD operations for todos)
  - SQLite persistence
  - Input validation
  - Unit and integration tests

settings_matrix:
  - profile: discovery
    git_workflow: direct
    docs_mode: deferred
    expectations:
      workflow:
        # Discovery: lightweight checks — did it follow the basic flow?
        - type: features_have_status
          status: shipped
          min: 1
        - type: commits_follow_convention
          min: 2
        - type: no_wip_at_end

  - profile: autonomous_formal
    git_workflow: pull_request
    review_merge: skip
    expectations:
      workflow:
        # Formal: full rigor — plans, reviews, checked ACs
        - type: features_have_status
          status: shipped
          min: 1
        - type: plans_exist
          min: 1
        - type: plans_approved
          min: 1
        - type: acceptance_criteria_checked
          min: 1
        - type: journal_updated
        - type: commits_follow_convention
          min: 2
        - type: no_wip_at_end

required_milestones:
  - kickoff_complete
  - features_specced
  - implementation_done
  - verification_green

# Shared expectations — these apply to ALL settings combos
expectations:
  files_exist:
    - "app/**/*.py"
    - "tests/test_*.py"
    - "requirements.txt"
  commands_pass:
    - "pip install -q -r requirements.txt && python -m pytest tests/ -x -q"
  source_contains:
    - pattern: "fastapi|FastAPI"
      glob: "app/**/*.py"
    - pattern: "sqlite|SQLite|sqlalchemy|SQLAlchemy"
      glob: "app/**/*.py"
    - pattern: "def test_"
      glob: "tests/**/*.py"
