name: "Todo App"
description: "CRUD todo app with REST API and persistence"
type: single
timeout: 3600

stack:
  language: python
  framework: fastapi
  test_runner: pytest

vision: |
  Build a simple todo application with:
  - REST API (CRUD operations for todos)
  - SQLite persistence
  - Input validation
  - Unit and integration tests

settings_matrix:
  - profile: discovery
    git_workflow: direct
    docs_mode: deferred

  - profile: autonomous_formal
    git_workflow: pull_request
    review_merge: skip

required_milestones:
  - kickoff_complete
  - features_specced
  - implementation_done
  - verification_green

# Shared expectations — these apply to ALL settings combos
expectations:
  files_exist:
    - "app/**/*.py"
    - "tests/test_*.py"
    - "requirements.txt"
  commands_pass:
    - "pip install -q -r requirements.txt && python -m pytest tests/ -x -q"
  source_contains:
    - pattern: "fastapi|FastAPI"
      glob: "app/**/*.py"
    - pattern: "sqlite|SQLite|sqlalchemy|SQLAlchemy"
      glob: "app/**/*.py"
    - pattern: "def test_"
      glob: "tests/**/*.py"
