name: "CLI Tool"
description: "Command-line tool with subcommands and configuration"
type: single
timeout: 3600

stack:
  language: python
  framework: click
  test_runner: pytest

vision: |
  Build a command-line file organizer tool with:
  - Subcommands: organize, search, stats
  - Configuration file support (YAML)
  - File type detection and categorization
  - Unit tests for each subcommand

settings_matrix:
  - profile: discovery
    git_workflow: direct
    docs_mode: deferred
    expectations:
      workflow:
        - type: journal_updated
        - type: commits_follow_convention
          min: 2
        - type: no_wip_at_end

  - profile: autonomous_formal
    git_workflow: pull_request
    review_merge: skip
    expectations:
      workflow:
        - type: features_have_status
          status: shipped
          min: 1
        - type: plans_exist
          min: 1
        - type: plans_approved
          min: 1
        - type: acceptance_criteria_checked
          min: 1
        - type: journal_updated
        - type: commits_follow_convention
          min: 2
        - type: no_wip_at_end

required_milestones:
  - kickoff_complete
  - features_specced
  - implementation_done
  - verification_green

expectations:
  files_exist:
    - "**/*.py"
    - "tests/test_*.py"
  commands_pass:
    - "pip install -q -e . 2>/dev/null; python -m pytest tests/ -x -q"
  source_contains:
    - pattern: "click|Click|argparse"
      glob: "**/*.py"
    - pattern: "def test_"
      glob: "tests/**/*.py"
