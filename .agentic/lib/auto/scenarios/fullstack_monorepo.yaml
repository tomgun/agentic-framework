name: "Fullstack Monorepo"
description: "React frontend + FastAPI backend + shared types in one repo"
type: monorepo
timeout: 7200

components:
  - name: api
    path: packages/api
    type: python
    framework: fastapi
    test_command: "pytest packages/api/tests/"
  - name: web
    path: packages/web
    type: typescript
    framework: react
    test_command: "npm run test --workspace=web"
  - name: shared
    path: packages/shared
    type: typescript
    test_command: "npm run test --workspace=shared"

vision: |
  Build a fullstack task management app:
  - React frontend with task list and creation form
  - FastAPI backend with REST endpoints
  - Shared TypeScript types between frontend and API client
  - Integration tests verifying frontend-to-backend flow

settings_matrix:
  - profile: formal
    git_workflow: pull_request
    review_merge: skip
    expectations:
      workflow:
        - type: features_have_status
          status: shipped
          min: 1
        - type: plans_exist
          min: 1
        - type: plans_approved
          min: 1
        - type: acceptance_criteria_checked
          min: 1
        - type: journal_updated
        - type: commits_follow_convention
          min: 3
        - type: no_wip_at_end

required_milestones:
  - kickoff_complete
  - features_specced
  - component_features_scoped
  - implementation_done
  - integration_verified
  - verification_green

expectations:
  files_exist:
    - "packages/api/**/*.py"
    - "packages/web/src/**/*.{ts,tsx}"
    - "packages/shared/**/*.ts"
  source_contains:
    - pattern: "fastapi|FastAPI"
      glob: "packages/api/**/*.py"
    - pattern: "react|React"
      glob: "packages/web/src/**/*.{ts,tsx}"
