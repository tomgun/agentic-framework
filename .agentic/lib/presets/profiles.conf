# format: profiles-v1.0
# Profile presets: profile.setting=value
# These define defaults when a setting is not explicitly overridden in STACK.md.
# Users override via STACK.md ## Settings section.

# --- Discovery profile (lightweight, exploratory) ---
discovery.feature_tracking=no
discovery.acceptance_criteria=recommended
discovery.wip_before_commit=warning
discovery.pre_commit_checks=fast
discovery.pre_commit_hook=fast
discovery.git_workflow=direct
discovery.plan_review_enabled=no
discovery.spec_directory=no
discovery.docs_gate=off
discovery.spec_analysis=off
discovery.max_files_per_commit=15
discovery.max_added_lines=1000
discovery.max_code_file_length=1000
discovery.periodic_orphaned_plans=every_session
discovery.periodic_retro_check=off
discovery.periodic_agent_refresh=off
discovery.docs_stale_days=30
discovery.retrospective_enabled=no
discovery.qa_propagation_warn_days=3
discovery.qa_propagation_escalate_days=7
discovery.qa_audit_freshness_days=30
discovery.review_spec=auto
discovery.review_criteria=auto
discovery.review_plan=auto
discovery.review_code=critical_agent
discovery.review_merge=human
discovery.review_decomposition=auto
discovery.review_regression=critical_agent
discovery.worktree_mode=off
discovery.review_taste=auto

# --- Formal profile (structured, spec-driven) ---
formal.feature_tracking=yes
formal.acceptance_criteria=blocking
formal.wip_before_commit=blocking
formal.pre_commit_checks=full
formal.pre_commit_hook=fast
formal.git_workflow=pull_request
formal.plan_review_enabled=yes
formal.spec_directory=yes
formal.docs_gate=blocking
formal.spec_analysis=on
formal.max_files_per_commit=10
formal.max_added_lines=500
formal.max_code_file_length=500
formal.periodic_orphaned_plans=every_session
formal.periodic_retro_check=every_5_sessions
formal.periodic_agent_refresh=every_20_sessions
formal.docs_stale_days=30
formal.retrospective_enabled=yes
formal.qa_propagation_warn_days=3
formal.qa_propagation_escalate_days=7
formal.qa_audit_freshness_days=30
formal.review_spec=critical_agent
formal.review_criteria=critical_agent
formal.review_plan=critical_agent
formal.review_code=human
formal.review_merge=human
formal.review_decomposition=critical_agent
formal.review_regression=human
formal.worktree_mode=off
formal.review_taste=critical_agent
