discovery.kickoff_confirm=skip
discovery.feedback_mode=pr_review
discovery.annotation_enforcement=off
discovery.max_parallel_agents=3
discovery.review_pr=skip
discovery.pr_fix_max_attempts=0
discovery.plan_review_convergence=manual
discovery.plan_review_reviewers=critic,advocate
discovery.git_mode=deferred
discovery.main_branch_mode=direct
discovery.catalog_enforcement=advisory
discovery.intel_capture=retro
discovery.btrace=off

