# Context Manifest: Explore Agent
# Quick codebase exploration, finding files, understanding structure

role: explore-agent
token_budget: 2000
description: Navigate codebase, find files, understand structure

required:
  - CONTEXT_PACK.md[entry_points,modules]  # Where code lives
  - STACK.md[tech_stack]                   # Languages, frameworks

optional:
  - spec/acceptance/{feature_id}.md        # If exploring for a specific feature

exclude:
  - JOURNAL.md
  - STATUS.md
  - .agentic/workflows/
  - docs/research/
  - spec/PRD.md

variables:
  - feature_id

section_markers:
  CONTEXT_PACK.md:
    entry_points: "## Entry Points"
    modules: "## Modules"
  STACK.md:
    tech_stack: "## Tech Stack"
