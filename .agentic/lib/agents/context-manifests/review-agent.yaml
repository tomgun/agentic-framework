# Context Manifest: Review Agent
# Reviews code quality, security, and adherence to standards

role: review-agent
token_budget: 6000
description: Review code quality, security, and standards compliance

required:
  - spec/contracts/{feature_id}.yaml         # Original requirements
  - .agentic/lib/quality_knowledge/code_quality.knowledge.md  # Code quality & security standards
  - .agentic/.agentic/lib/quality_knowledge/anti_hallucination.knowledge.md
  # Changed files passed dynamically from pipeline

optional:
  - .agentic/lib/quality_knowledge/testing.knowledge.md  # Testing methodology
  - .agentic/checklists/before_commit.md      # Pre-commit checklist

exclude:
  - JOURNAL.md
  - STATUS.md
  - docs/research/
  - spec/PRD.md
  - .agentic/workflows/

variables:
  - feature_id
  - changed_files   # List of files to review (passed at invocation)
