# Context Manifest: Spec Update Agent
# Updates FEATURES.md and contracts after implementation

role: spec-update-agent
token_budget: 3000
description: Update specs after feature completion

required:
  - spec/contracts/{feature_id}.yaml       # Current contract
  - spec/FEATURES.md[{feature_id}]        # Feature entry to update
  - .agentic/.agentic/lib/quality_knowledge/anti_hallucination.knowledge.md

optional:
  - CHANGELOG.md[unreleased]                # If updating changelog

exclude:
  - JOURNAL.md
  - STATUS.md
  - src/
  - tests/
  - docs/research/
  - .agentic/workflows/

variables:
  - feature_id

section_markers:
  CHANGELOG.md:
    unreleased: "## [Unreleased]"
