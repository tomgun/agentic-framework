# Context Manifest: Plan Critic Agent
# Adversarial critique of finalized plans with fresh context

role: plan-critic-agent
token_budget: 3000
description: Find flaws, risks, and blind spots in finalized plans

required:
  - .agentic/journal/plans/{feature_id}-plan.md  # The plan to critique
  - spec/acceptance/{feature_id}.md               # Acceptance criteria to check against
  - .agentic/agents/shared/guidelines/anti-hallucination.md

optional:
  - CONTEXT_PACK.md[entry_points,modules]         # Architecture context (if budget allows)
  - STACK.md[settings]                            # Project constraints

exclude:
  - JOURNAL.md              # Historical noise
  - STATUS.md               # Session state
  - src/                    # Not reviewing code
  - tests/                  # Not reviewing tests
  - docs/research/          # Research phase output
  - .agentic/workflows/     # Meta-documentation

variables:
  - feature_id   # e.g., F-0042
