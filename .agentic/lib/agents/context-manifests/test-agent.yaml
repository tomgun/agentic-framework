# Context Manifest: Test Agent
# Writes tests based on contract assertions BEFORE implementation (TDD)

role: test-agent
token_budget: 4000
description: Write failing tests for contract assertions (TDD red phase)

required:
  - spec/contracts/{feature_id}.yaml       # What to test
  - STACK.md[test_framework,test_commands]  # How to test
  - .agentic/lib/quality_knowledge/testing.knowledge.md  # Testing methodology
  - .agentic/.agentic/lib/quality_knowledge/anti_hallucination.knowledge.md

optional:
  - tests/                                  # Existing test patterns (sampled)
  - CONTEXT_PACK.md[modules]                # Where code will live

exclude:
  - JOURNAL.md
  - STATUS.md
  - docs/research/
  - spec/PRD.md
  - .agentic/workflows/

variables:
  - feature_id

section_markers:
  STACK.md:
    test_framework: "## Test"
    test_commands: "## Test"
  CONTEXT_PACK.md:
    modules: "## Modules"
