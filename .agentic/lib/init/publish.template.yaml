# publish.yaml — App Store Publishing Configuration
# Generated by: ag publish init
# Docs: https://github.com/tomgun/agentic-framework/docs/publishing.md

ios:
  bundle_id: com.example.myapp
  team_id: XXXXXXXXXX
  scheme: MyApp
  workspace: MyApp.xcworkspace
  distribution: app-store  # app-store | ad-hoc | enterprise

android:
  package_name: com.example.myapp
  track: internal  # internal | alpha | beta | production
  format: aab      # aab | apk

screenshots:
  ios_devices: ["iPhone 16 Pro Max", "iPad Pro 13-inch"]
  android_devices: ["phone", "sevenInch", "tenInch"]
  locales: ["en-US"]

custom:  # Only when publish_provider: custom
  # build_cmd: ./scripts/build.sh
  # screenshots_cmd: ./scripts/screenshots.sh
  # submit_cmd: ./scripts/submit.sh
