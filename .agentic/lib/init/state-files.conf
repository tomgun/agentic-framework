# State files: single source of truth for scaffold, upgrade, and verify.
# Format: destination:template:profile
# profile: all = both profiles, formal = formal only
# Add new state files HERE — scaffold.sh, upgrade.sh, verify.py all read this.
# Note: spec/TECH_SPEC.md is excluded — scaffold.sh handles it with a richer
# placeholder fallback. AGENTS.md was previously inline; now uses a template.
.agentic/STATUS.md:.agentic/lib/init/STATUS.template.md:all
STACK.md:.agentic/lib/init/STACK.template.md:all
CONTEXT_PACK.md:.agentic/lib/init/CONTEXT_PACK.template.md:all
.agentic/OVERVIEW.md:.agentic/lib/init/OVERVIEW.template.md:all
.agentic/HUMAN_NEEDED.md:.agentic/lib/templates/HUMAN_NEEDED.template.md:all
.agentic/TODO.md:.agentic/lib/templates/TODO.template.md:all
AGENTS.md:.agentic/lib/init/AGENTS.template.md:all
.agentic/journal/JOURNAL.md:.agentic/lib/templates/JOURNAL.template.md:all
.agentic/spec/FEATURES.md:.agentic/lib/templates/FEATURES.template.md:formal
.agentic/spec/ISSUES.md:.agentic/lib/templates/ISSUES.template.md:formal
.agentic/spec/LESSONS.md:.agentic/lib/templates/LESSONS.template.md:formal
.agentic/spec/NFR.md:.agentic/lib/templates/NFR.template.md:formal
.agentic/spec/REFERENCES.md:.agentic/lib/templates/REFERENCES.template.md:formal
.agentic/spec/acceptance/README.md:.agentic/lib/templates/acceptance/README.template.md:formal
